<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Busão Lotado das Capivaras</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
  #palco{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:#7fd0ff;--u:4px;
    --fonteNome:4.4;--fonteBalao:4.6;--fotoGrande:7.4;--topo:calc(var(--u)*16);--lado:calc(var(--u)*2.6)}
  #palco canvas.gl{display:block;width:100%!important;height:100%!important}

  /* letreiro de LED */
  #letreiro{position:absolute;top:var(--topo);left:50%;transform:translateX(-50%);text-align:center;z-index:3;
    background:#141414;border:calc(var(--u)*.7) solid #3a3a3a;border-radius:calc(var(--u)*2.2);
    padding:calc(var(--u)*1) calc(var(--u)*2.2);box-shadow:0 calc(var(--u)*.8) calc(var(--u)*2) rgba(0,0,0,.35);
    font-family:"Courier New",Courier,monospace;color:#ffb300;text-shadow:0 0 calc(var(--u)*1.2) #ff8f00;white-space:nowrap;pointer-events:none}
  #letreiro .linha{font-size:calc(var(--u)*4.7);font-weight:900;letter-spacing:.06em;line-height:1.05}
  #letreiro .bordo{font-size:calc(var(--u)*3.1);font-weight:700;line-height:1.2}
  /* Fase 5.1: placar dos 3 primeiros. Fase 5.3: uma linha por posição (cabe no HUD de 9 a 21 % da altura). HTML criado uma vez. */
  #placar{position:relative;width:100%;box-sizing:border-box;display:none;
    background:rgba(20,24,36,.84);color:#fff;border:calc(var(--u)*.45) solid rgba(255,213,79,.9);border-radius:calc(var(--u)*2.4);
    padding:calc(var(--u)*.7) calc(var(--u)*1.1) calc(var(--u)*.8);pointer-events:none;box-shadow:0 calc(var(--u)*.6) calc(var(--u)*1.6) rgba(0,0,0,.35)}
  #placar.ver{display:block}
  #placar .tit{font-size:calc(var(--u)*2.4);font-weight:900;color:#ffd54f;letter-spacing:.03em;white-space:nowrap;line-height:1.1}
  #placar .lin{display:grid;grid-template-columns:calc(var(--u)*3.6) minmax(0,1fr) auto;column-gap:calc(var(--u)*.7);align-items:center;margin-top:calc(var(--u)*.55)}
  #placar .lin[hidden]{display:none}
  #placar .pos{width:calc(var(--u)*3.6);height:calc(var(--u)*3.6);border-radius:50%;background:#546e7a;display:flex;align-items:center;justify-content:center;
    font-size:calc(var(--u)*2.6);font-weight:900}
  #placar .lin:first-of-type .pos{background:#ffb300;color:#3e2700}
  #placar .pos svg{width:84%;height:84%}
  #placar .nm{font-size:calc(var(--u)*3.2);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;line-height:1.1}
  #placar .tm{font-size:calc(var(--u)*2.9);font-weight:800;color:#ffe082;line-height:1.1;font-variant-numeric:tabular-nums}
  #placar .lin.fora .nm,#placar .lin.fora .tm{opacity:.42}

  /* Ajuste 17/11: área segura do TikTok. Fase 5.3: ZONAS FIXAS (CONFIG.tela.zonas; as variáveis vêm do redimensionar):
     --topo (9 %) · HUD até --hudFim (21 %) · faixa dos tronos até --zAnuncio · faixa do anúncio até --zBusao · busão até 64 % · chat do TikTok */
  .coluna{position:absolute;top:var(--topo);max-height:var(--hudAlt);overflow:hidden;display:flex;flex-direction:column;z-index:3;pointer-events:none}
  #colEsq{left:var(--ladoHud);width:calc(var(--u)*29)}
  #colDir{right:var(--ladoHud);width:calc(var(--u)*29);align-items:stretch}
  #palco{--ladoHud:calc(var(--u)*2)}
  #letreiro{max-height:var(--hudAlt);max-width:calc(var(--u)*37);box-sizing:border-box;padding:calc(var(--u)*.8) calc(var(--u)*1.4)}
  #letreiro .bordo{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:calc(var(--u)*2.9);font-weight:800;letter-spacing:-.01em;margin-top:calc(var(--u)*.3)}
  /* Fase 5.4: card de dica = UM presente por vez: desenho grande em cima, efeito em letra grande embaixo (sem o nome do presente).
     Duas faces (A/B) criadas uma vez: enche a escondida e troca, com transição suave. Sempre o mesmo tamanho. A letra encolhe para caber. */
  #dica{position:relative;width:100%;height:calc(var(--u)*17);max-height:var(--hudAlt)}
  #dica .face{position:absolute;inset:0;box-sizing:border-box;border-radius:calc(var(--u)*2.6);border:calc(var(--u)*.6) solid var(--cor,#fff);
    background:#12141c;color:#fff;box-shadow:0 calc(var(--u)*.6) calc(var(--u)*1.6) rgba(0,0,0,.4);opacity:0;visibility:hidden;transform:scale(.96);
    transition:opacity .45s,transform .45s,visibility 0s .45s;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:calc(var(--u)*.5) calc(var(--u)*.9) calc(var(--u)*.7);isolation:isolate}
  #dica .face.ver{opacity:1;visibility:visible;transform:none;transition:opacity .45s,transform .45s,visibility 0s}
  #dica .face.comente{background:#2e7d32}
  /* os desenhos que o criador salvou são JPEG com fundo preto: "lighten" some com o preto em cima do fundo escuro do card */
  #dica .face img{display:block;flex:none;width:calc(var(--u)*10.2);height:calc(var(--u)*10.2);object-fit:contain;mix-blend-mode:lighten}
  #dica .face.comente img{mix-blend-mode:normal}
  #dica .face .ef{display:block;width:100%;flex:none;text-align:center;white-space:nowrap;overflow:hidden;font-weight:900;line-height:1.08;
    color:#ffe082;letter-spacing:.01em;margin-top:calc(var(--u)*.3);font-size:calc(var(--u)*4.4)}
  #dica .face.comente .ef{color:#fff59d}

  /* Fase 5.4: VITRINE (fileira com os 7: desenho + efeito embaixo), na faixa do anúncio, de vez em quando. Nunca junto com um anúncio.
     Criada uma vez. "--esc" encolhe para caber na faixa (como o anúncio da 5.3). */
  #vitrine{position:absolute;top:var(--zAnuncio);left:50%;transform:translateX(-50%) scale(calc(var(--esc,1)*.9));transform-origin:50% 0;opacity:0;visibility:hidden;z-index:4;
    pointer-events:none;display:flex;align-items:stretch;gap:0;padding:calc(var(--u)*.45) calc(var(--u)*.4);box-sizing:border-box;
    background:#12141c;border:calc(var(--u)*.45) solid #ffd54f;border-radius:calc(var(--u)*2.2);white-space:nowrap;
    transition:opacity .35s,transform .35s,visibility 0s .35s}
  #vitrine.ver{opacity:1;visibility:visible;transform:translateX(-50%) scale(var(--esc,1));transition:opacity .35s,transform .35s,visibility 0s}
  #vitrine.ja{transition:none}
  #vitrine .it{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:none;min-width:calc(var(--u)*7);padding:0 calc(var(--u)*.55)}
  #vitrine .it+.it{border-left:calc(var(--u)*.25) solid rgba(255,255,255,.22)}   /* risquinho entre um presente e outro */
  #vitrine img{display:block;width:calc(var(--u)*5.9);height:calc(var(--u)*5.9);object-fit:contain;mix-blend-mode:lighten}
  #vitrine .it.comente img{mix-blend-mode:normal}
  #vitrine .ef{display:block;font-size:calc(var(--u)*2.85);font-weight:900;line-height:1.05;color:#ffe082;white-space:nowrap;margin-top:calc(var(--u)*.25)}
  #vitrine .it.comente .ef{color:#a5d6a7}

  /* Fase 5.3: FAIXA DOS TRONOS (no lugar das plaquinhas "MOTORISTA"/"COBRADOR" do busão): uma faixa fina, de largura inteira, logo abaixo do HUD */
  #faixaTronos{position:absolute;top:var(--zTronos);height:var(--altTronos);left:var(--lado);right:var(--lado);z-index:3;pointer-events:none;
    display:flex;gap:calc(var(--u)*1.2);box-sizing:border-box}
  #faixaTronos .meia{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:calc(var(--u)*.8);box-sizing:border-box;height:100%;
    background:rgba(20,24,36,.86);color:#fff;border-radius:999px;border:calc(var(--u)*.45) solid #d32f2f;padding:0 calc(var(--u)*1.2) 0 calc(var(--u)*.35);
    font-weight:900;font-size:calc(var(--u)*3.3);line-height:1;white-space:nowrap}
  #faixaTronos .meia.cobrador{border-color:#9c27b0}
  #faixaTronos .ic{flex:none;height:calc(var(--altTronos) - var(--u)*1.4);aspect-ratio:1;border-radius:50%;background:#d32f2f;display:flex;align-items:center;justify-content:center}
  #faixaTronos .cobrador .ic{background:#7b1fa2}
  #faixaTronos .ic svg{width:80%;height:80%}
  #faixaTronos .nm{min-width:0;overflow:hidden;text-overflow:ellipsis}
  #faixaTronos .meia.empresa{border-color:#78909c;color:#b0bec5}
  #faixaTronos .meia.empresa .ic{background:#78909c}
  #faixaTronos .fz{display:none;align-items:center;gap:calc(var(--u)*.35);flex:none;background:#fff;color:#1565c0;border-radius:999px;
    padding:calc(var(--u)*.2) calc(var(--u)*.7) calc(var(--u)*.2) calc(var(--u)*.3);font-size:.82em;font-variant-numeric:tabular-nums}
  #faixaTronos .fz svg{width:calc(var(--u)*3);height:calc(var(--u)*3)}
  #faixaTronos .fz.ver{display:flex}
  #faixaTronos .fz .pg{display:none}
  #faixaTronos .fz.perigo .im{display:none}
  #faixaTronos .fz.perigo .pg{display:block}
  #faixaTronos .fz.perigo{padding:calc(var(--u)*.2) calc(var(--u)*.35)}
  #faixaTronos .fz.max{animation:perigoMax .7s ease-in-out infinite alternate}
  @keyframes perigoMax{from{box-shadow:0 0 0 0 rgba(255,255,255,.9)}to{box-shadow:0 0 0 calc(var(--u)*.8) rgba(255,82,82,.55)}}
  #faixaTronos .soma{display:none;flex:none;color:#3e2700;background:#ffca28;border:calc(var(--u)*.3) solid #fff;border-radius:999px;
    padding:calc(var(--u)*.15) calc(var(--u)*.7);font-size:.85em;animation:pisca .45s ease-in-out infinite alternate}
  #faixaTronos .soma.ver{display:block}
  @keyframes pisca{from{opacity:1}to{opacity:.45}}

  /* ANÚNCIO (Fase 5.3): sempre na faixa do anúncio, um por vez. "--esc" encolhe o anúncio para caber na faixa (nunca cobre o HUD).
     Dois tamanhos: grande (foto + duas linhas) e compacto (uma linha: "@Capivânia → PAGODE!"). Elementos fixos, reaproveitados. */
  #anuncio{position:absolute;top:var(--zAnuncio);left:50%;transform:translateX(-50%) scale(calc(var(--esc,1)*.5));transform-origin:50% 0;opacity:0;z-index:4;
    display:flex;align-items:center;gap:calc(var(--u)*1.4);box-sizing:border-box;
    background:#ffeb3b;color:#222;font-weight:900;padding:calc(var(--u)*.7) calc(var(--u)*2.4) calc(var(--u)*.7) calc(var(--u)*.7);
    border-radius:calc(var(--u)*3);border:calc(var(--u)*.7) solid #222;box-shadow:0 calc(var(--u)*.8) calc(var(--u)*2) rgba(0,0,0,.4);
    transition:transform .28s cubic-bezier(.2,1.6,.4,1),opacity .2s;pointer-events:none}
  #anuncio.ver{opacity:1;transform:translateX(-50%) scale(var(--esc,1))}
  #anuncio canvas{width:calc(var(--u)*8.6);height:calc(var(--u)*8.6);border-radius:50%;flex:none;display:none;
    border:calc(var(--u)*.6) solid #222;background:#fff;box-sizing:border-box}
  #anuncio.comFoto canvas{display:block}
  #anuncio .txt{display:flex;flex-direction:column;min-width:0;line-height:1.08}
  #anuncio .l1,#anuncio .l3{display:flex;gap:.28em;align-items:baseline;white-space:nowrap;min-width:0}
  #anuncio .l1{font-size:calc(var(--u)*3.8)}
  #anuncio .nome{color:#c2185b;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:calc(var(--u)*56)}
  #anuncio .resto,#anuncio .de,#anuncio .tirou{flex:none}
  #anuncio .l2{font-size:calc(var(--u)*4.7);white-space:nowrap;letter-spacing:.01em;margin-top:.04em}
  #anuncio .agora{font-size:.7em;font-weight:900}
  #anuncio .cargo.motorista{color:#d32f2f}
  #anuncio .cargo.cobrador{color:#7b1fa2}
  #anuncio .mais{display:none;color:#c2185b;flex:none}
  #anuncio.comMais .mais{display:inline}
  #anuncio .l3{display:none;font-size:calc(var(--u)*3.4);font-weight:800;color:#333;margin-top:.18em}
  #anuncio.comTirou .l3,#anuncio.comMais .l3{display:none}   /* Fase 5.3: sem a 3ª linha ("tirou @x do volante", "@x voou!"): cabe na faixa do anúncio */
  #anuncio:not(.comTirou) .tirou,#anuncio:not(.comTirou) .nome2,#anuncio:not(.comTirou) .de{display:none}
  #anuncio .nome2{overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:calc(var(--u)*34)}
  #anuncio.soTexto{padding:calc(var(--u)*1.3) calc(var(--u)*3)}
  #anuncio.soTexto .l2{display:none}
  #anuncio.soTexto .l1{font-size:calc(var(--u)*4.6);white-space:nowrap;justify-content:center;text-align:center}
  #anuncio.soTexto .resto{flex:1 1 auto}
  /* compacto: uma linha só, letra menor, fotinha pequena */
  #anuncio.compacto{gap:calc(var(--u)*1);padding:calc(var(--u)*.6) calc(var(--u)*2) calc(var(--u)*.6) calc(var(--u)*.6);border-width:calc(var(--u)*.5);border-radius:999px}
  #anuncio.compacto canvas{width:calc(var(--u)*6.2);height:calc(var(--u)*6.2);border-width:calc(var(--u)*.4)}
  #anuncio.compacto .l1{font-size:calc(var(--u)*3.9)}
  #anuncio.compacto .l2,#anuncio.compacto .l3{display:none}
  #anuncio.compacto .nome{max-width:calc(var(--u)*50)}
  #anuncio.compacto .seta{flex:none;color:#555}
  #anuncio.compacto.soTexto{padding:calc(var(--u)*.9) calc(var(--u)*2.6)}
  /* Fase 4: anúncios de caos (mesmo elemento, uma cor de faixa por efeito) */
  #anuncio.caos .agora{font-size:.62em}
  #anuncio.caos .resto{color:#b71c1c}
  #anuncio.caos .cargo{color:#111}
  #anuncio.caos .l3{color:#0d47a1}
  #anuncio.caos-freada{background:#ffab91}
  #anuncio.caos-buraco{background:#d7ccc8}
  #anuncio.caos-lombada{background:#ffe082}
  #anuncio.caos-fiscal{background:#ffcc80}
  #anuncio.caos-janela{background:#81d4fa}
  #anuncio.caos-gigante{background:#c5e1a5}
  #anuncio.caos-pagode{background:#f8bbd0}
  #anuncio.caos-buzinaco{background:#fff59d}
  #anuncio.caos-pneu{background:#cfd8dc}
  #anuncio.caos-vip{background:#ffd54f;border-color:#7a5200}
  /* Fase 5.1: anúncios do Rei do Busão */
  #anuncio.rei{background:#ffd54f;border-color:#7a5200}
  #anuncio.rei .resto{color:#5d4037}
  #anuncio.queda{background:#ffcdd2;border-color:#b71c1c}
  #anuncio.queda .resto{color:#b71c1c}
  #anuncio.ponto{background:#bbdefb;border-color:#0d47a1}
  #anuncio.ponto .resto{color:#0d47a1}
  /* Fase 5.2: "ABAIXA!" (perigo do caminho) */
  #anuncio.perigo{background:#ff9800;border-color:#3e2723}
  #anuncio.perigo .resto{color:#fff;font-size:1.6em;letter-spacing:.04em;text-shadow:0 calc(var(--u)*.3) 0 #3e2723}

  /* Fase 5.3: tudo o que fica na zona do busão é COLADO na capivara: plaquinha de nome (temporária), balão de chat
     (foto + nome + texto numa peça só) e balãozinho de efeito ("CAIU!", "SEGURA AÍ!", "SEGUROU!", "Zzz…"). A setinha aponta
     para a cabeça (--rx = onde fica a setinha, em px a partir da esquerda). Elementos fixos, reaproveitados. */
  #rotulos{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
  .placa{position:absolute;left:0;top:0;display:none;align-items:center;gap:calc(var(--u)*1);box-sizing:border-box;
    background:#fff;border:calc(var(--u)*.7) solid #888;border-radius:999px;white-space:nowrap;
    padding:calc(var(--u)*.4) calc(var(--u)*2.2) calc(var(--u)*.4) calc(var(--u)*.4);
    box-shadow:0 calc(var(--u)*.5) calc(var(--u)*1.2) rgba(0,0,0,.5);transform-origin:var(--rx,50%) 100%;will-change:transform}
  .placa::after{content:"";position:absolute;left:var(--rx,50%);bottom:calc(var(--u)*-1.5);width:0;height:0;margin-left:calc(var(--u)*-1.3);
    border-left:calc(var(--u)*1.3) solid transparent;border-right:calc(var(--u)*1.3) solid transparent;border-top:calc(var(--u)*1.6) solid var(--corPlaca,#888)}
  .placa canvas{width:calc(var(--u)*var(--fotoGrande));height:calc(var(--u)*var(--fotoGrande));border-radius:50%;display:block;flex:none}
  .placa span{font-weight:900;font-size:calc(var(--u)*var(--fonteNome));color:#111;line-height:1.05;letter-spacing:-.01em;
    max-width:calc(var(--u)*36);overflow:hidden;text-overflow:ellipsis;padding-bottom:.06em}
  .placa.apertado span{font-size:calc(var(--u)*var(--fonteNome)*.88)}
  .placa.brilho{animation:brilho .35s ease-in-out infinite alternate}
  @keyframes brilho{from{box-shadow:0 0 calc(var(--u)*1) calc(var(--u)*.6) #ffd54f}to{box-shadow:0 0 calc(var(--u)*3.4) calc(var(--u)*1.8) #ffeb3b}}
  .placa.vip{border-color:#ffb300!important;background:#fff8e1;animation:vip .6s ease-in-out infinite alternate}
  .placa.vip span{color:#7a4f00}
  @keyframes vip{from{box-shadow:0 0 calc(var(--u)*1.4) calc(var(--u)*.8) #ffca28}to{box-shadow:0 0 calc(var(--u)*4) calc(var(--u)*2.2) #ffe082}}
  .placa.escudo{box-shadow:0 0 0 calc(var(--u)*.7) #4fc3f7,0 0 calc(var(--u)*2) calc(var(--u)*.6) #81d4fa}
  /* balão de chat: foto + @nome + texto (no máximo 2 linhas), logo acima da cabeça */
  .balao{position:absolute;left:0;top:0;display:none;box-sizing:border-box;background:#fff;color:#111;text-align:left;--cor:#222;
    border:calc(var(--u)*.55) solid var(--cor);border-radius:calc(var(--u)*2.8);padding:calc(var(--u)*.55) calc(var(--u)*1.4) calc(var(--u)*.55) calc(var(--u)*.55);
    max-width:calc(var(--u)*44);font-weight:800;font-size:calc(var(--u)*var(--fonteBalao));line-height:1.13;
    transform-origin:var(--rx,50%) 100%;will-change:transform,opacity;box-shadow:0 calc(var(--u)*.6) calc(var(--u)*1.4) rgba(0,0,0,.35)}
  .balao::after{content:"";position:absolute;left:var(--rx,50%);bottom:calc(var(--u)*-1.3);width:calc(var(--u)*2.1);height:calc(var(--u)*2.1);
    background:#fff;border-right:calc(var(--u)*.55) solid var(--cor);border-bottom:calc(var(--u)*.55) solid var(--cor);transform:translateX(-50%) rotate(45deg)}
  .balao .lin{display:flex;align-items:center;gap:calc(var(--u)*.8)}
  .balao .foto{flex:none;width:calc(var(--u)*4.8);height:calc(var(--u)*4.8);border-radius:50%;box-shadow:0 0 0 calc(var(--u)*.4) var(--cor)}
  .balao .txt{min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
  .balao .quem{font-weight:900;color:var(--cor);margin-right:.3em}
  .balao.auto{background:#eceff1}
  .balao.auto::after{background:#eceff1}
  /* balãozinho de efeito: pequeno, uma palavra */
  .efeito{position:absolute;left:0;top:0;display:none;box-sizing:border-box;white-space:nowrap;font-weight:900;font-size:calc(var(--u)*3.4);line-height:1;
    padding:calc(var(--u)*.55) calc(var(--u)*1.3);border-radius:calc(var(--u)*2);border:calc(var(--u)*.5) solid var(--bc);background:var(--bg);color:var(--fg);
    transform-origin:var(--rx,50%) 100%;box-shadow:0 calc(var(--u)*.4) calc(var(--u)*1) rgba(0,0,0,.35);--bg:#ffcdd2;--bc:#b71c1c;--fg:#c62828}
  .efeito::after{content:"";position:absolute;left:var(--rx,50%);bottom:calc(var(--u)*-1.1);width:calc(var(--u)*1.6);height:calc(var(--u)*1.6);
    background:var(--bg);border-right:calc(var(--u)*.5) solid var(--bc);border-bottom:calc(var(--u)*.5) solid var(--bc);transform:translateX(-50%) rotate(45deg)}
  .efeito.segura{--bg:#e1bee7;--bc:#6a1b9a;--fg:#4a148c}

  #inicio #iniComecar{display:block;width:100%;margin-top:calc(var(--u)*4);font:inherit;font-weight:900;font-size:1.25em;padding:calc(var(--u)*3);
    border:0;border-radius:calc(var(--u)*3);background:#2e9b4f;color:#fff;box-shadow:0 calc(var(--u)*.8) 0 #1b5e20}

  /* canto secreto */
  #cantinho{position:absolute;left:0;top:0;width:18%;height:10%;z-index:5}

  /* painel secreto */
  #painel{position:absolute;inset:0;z-index:10;background:rgba(12,16,24,.94);color:#eee;overflow:auto;
    font-size:clamp(13px,calc(var(--u)*3.3),26px);padding:calc(var(--u)*3);box-sizing:border-box;-webkit-user-select:text;user-select:text}
  #painel[hidden]{display:none}

  #painel button{font:inherit;font-size:.95em;margin:.18em .12em;padding:.45em .7em;border-radius:.5em;border:0;
    background:#2d3a52;color:#fff;cursor:pointer}

  #painel button.trono{background:#7a3b14}

  #painel button.caos2{background:#4a148c}

</style>

    },
    balaoDistMax: 0.06,     // distância máxima entre a ponta da setinha (de balão ou plaquinha) e a cabeça (fração da altura)
    filaBalaoSeg: 1,        // com 3 balões na tela, um comentário espera no máximo 1 s; depois é descartado (continua valendo no jogo)

  s = s.split(/\s+/).filter(Boolean).map((p) => (PROIBIDAS.has(semAcento(p).replace(/[^a-z0-9]/g, '')) ? '***' : p)).join(' ').trim();

/* =====================================================================
   FOTOS DE PERFIL (cache por URL, até 4 carregando ao mesmo tempo, nunca trava)
   Fase 5: se a foto direta falhar e houver proxy no CONFIG, tenta pelo proxy UMA vez.
   ===================================================================== */
const fotos = (() => {
  const T = CONFIG.fotos.tamanho;
  const cache = new Map();     // url -> { estado: 'carregando'|'ok'|'erro', canvas, espera: [], motivo, caminho: 'direto'|'proxy'|'inicial' }
  const filaCarga = []; let ativos = 0;
  const cont = { direto: 0, proxy: 0, inicial: 0, tentativasProxy: 0 };
  function urlProxy(url) {
    const p = CONFIG.fotos.proxy; if (!p || /^data:|^blob:/i.test(url)) return null;
    return p.includes('{url}') ? p.replace('{url}', encodeURIComponent(url)) : p + encodeURIComponent(url);
  }
  function pedir(url, cb) {
    if (!url) return;
    let e = cache.get(url);
    if (e) {
      cache.delete(url); cache.set(url, e);   // vira a mais recente
      if (e.estado === 'ok') cb(e.canvas, e); else if (e.estado === 'erro') cb(null, e); else e.espera.push(cb);
      return;
    }
    e = { url, estado: 'carregando', canvas: null, espera: [cb], motivo: '', motivoDireto: '', caminho: '' };
    cache.set(url, e);
    while (cache.size > CONFIG.fotos.cache) cache.delete(cache.keys().next().value);
    filaCarga.push(e); bombear();
  }
  function bombear() { while (ativos < CONFIG.fotos.simultaneas && filaCarga.length) carregar(filaCarga.shift(), false); }
  function carregar(e, viaProxy) {
    ativos++;
    const img = new Image(); img.crossOrigin = 'anonymous'; img.decoding = 'async';
    let fim = false;
    const terminar = (ok, motivo) => {
      if (fim) return; fim = true; clearTimeout(relogio); ativos--;
      img.onload = img.onerror = null;
      if (!ok && !viaProxy && urlProxy(e.url)) { e.motivoDireto = motivo; cont.tentativasProxy++; carregar(e, true); return; }   // plano B: proxy (uma vez)
      e.estado = ok ? 'ok' : 'erro'; e.motivo = motivo || ''; e.caminho = ok ? (viaProxy ? 'proxy' : 'direto') : 'inicial';
      cont[e.caminho]++;
      const lista = e.espera; e.espera = [];
      for (const cb of lista) { try { cb(ok ? e.canvas : null, e); } catch (err) { console.error(err); } }
      bombear();
    };
    const relogio = setTimeout(() => terminar(false, 'demorou demais'), CONFIG.fotos.tempoLimite);
    img.onload = () => {
      try {
        const w = img.naturalWidth, h = img.naturalHeight; if (!w || !h) return terminar(false, 'imagem vazia');
        const c = document.createElement('canvas'); c.width = c.height = T; const g = c.getContext('2d');
        const s = Math.min(w, h); g.drawImage(img, (w - s) / 2, (h - s) / 2, s, s, 0, 0, T, T);
        g.getImageData(0, 0, 1, 1); // se o site bloquear (CORS), isto dá erro
        e.canvas = c; terminar(true);
      } catch (err) { terminar(false, 'bloqueada pelo site (CORS)'); }
    };
    img.onerror = () => terminar(false, 'bloqueada (CORS) ou fora do ar');
    img.src = viaProxy ? urlProxy(e.url) : e.url;
  }
  function contagem() { let ok = 0, erro = 0, carregando = 0; for (const e of cache.values()) e.estado === 'ok' ? ok++ : e.estado === 'erro' ? erro++ : carregando++; return { ok, erro, carregando }; }
  return { pedir, contagem, cache, cont, urlProxy };
})();

   BUSÃO (geometria mesclada com cores por vértice = poucos desenhos)
   ===================================================================== */
function caixaColorida(x0, x1, y0, y1, z0, z1, cor) {
  const g = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0).toNonIndexed();
  g.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  return pintar(g, cor);
}
function pintar(g, cor) {
  const c = new THREE.Color(cor); const n = g.attributes.position.count; const arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b; }
  g.setAttribute('color', new THREE.BufferAttribute(arr, 3)); return g;
}
function mesclar(lista) {
  let total = 0; for (const g of lista) total += g.attributes.position.count;
  const pos = new Float32Array(total * 3), nor = new Float32Array(total * 3), cor = new Float32Array(total * 3);
  let o = 0;
  for (const g0 of lista) {
    const g = g0.index ? g0.toNonIndexed() : g0;
    pos.set(g.attributes.position.array, o * 3); nor.set(g.attributes.normal.array, o * 3); cor.set(g.attributes.color.array, o * 3);
    o += g.attributes.position.count;
  }
  const r = new THREE.BufferGeometry();
  r.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  r.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  r.setAttribute('color', new THREE.BufferAttribute(cor, 3));
  r.computeBoundingSphere(); return r;
}

  const todasVagas = [...vagasTrono, vagaRei, ...vagasDentro, ...vagasTeto];
  // lugar da vaga para os pesos do caos e para o empurrão: 'sentado' (banco, trono, Banco do Rei), 'pe' (em pé ou empilhado) ou 'teto'
  function lugarDe(v) { return !v ? null : v.local === 'teto' ? 'teto' : (v.tipo === 'pe' || v.tipo === 'empilhado') ? 'pe' : 'sentado'; }

  function vagaLivreDentro() {
    const m = estado.m;
    for (let i = 0; i < Math.min(m.dentro, vagasDentro.length); i++) {
      const v = vagasDentro[i];
      if (!v.ocupante && !v.reservada && (!v.embaixo || v.embaixo.ocupante)) return v;
    }
    return null;
  }
  function vagaLivreTeto() {
    const m = estado.m;

    return null;
  }
  function vagaLivre() { return vagaLivreDentro() || vagaLivreTeto(); }
  // quem perde o trono: de preferência em pé no corredor; senão qualquer lugar dentro; senão o teto
  function vagaCorredor() {
    const lim = Math.min(estado.m.dentro, vagasDentro.length);
    for (let i = 0; i < lim; i++) { const v = vagasDentro[i]; if (v.tipo === 'pe' && !v.ocupante && !v.reservada) return v; }
    return vagaLivre();
  }

  // ---------- registros ----------
  const porId = new Map();
  // Fase 5.1: as duas listas são a FILA DO PRÓXIMO PONTO (sobem na ordem: primeiro filaEmbarque, depois esperando)
  const filaEmbarque = []; // têm prioridade (perderam o trono sem lugar, presente sem ninguém para empurrar, trocaram de modo): não saem por tempo
  const esperando = [];    // comentaram: entram na ordem de chegada e saem por tempo (CONFIG.placar.pontoMin) se não interagirem
  const saindo = new Set();
  const contadores = { saidasTempoPonto: 0, cochilos: 0, derrubadas: 0, empurroes: 0, foraDoLimite: 0, subiuNaHora: 0, embarcouNoPonto: 0 };

  function novaCapivara(user) {
    const h = hashTexto(user.id + '|' + user.nome);
    const pelo = new THREE.Color().setHSL((24 + (h % 10)) / 360, 0.42 + ((h >> 4) % 10) / 100, 0.33 + ((h >> 8) % 10) / 100).getHex();
    const focinho = new THREE.Color(pelo).multiplyScalar(0.72).getHex();
    const c = {
      user: { id: user.id, nome: user.nome, foto: null }, inst: -1, estado: 'ponto', querEmbarcar: false, vaga: null,
      camisa: CAMISAS[h % CAMISAS.length], pelo, focinho, bone: ((h >> 12) % 2) ? BONES[(h >> 13) % BONES.length] : null,
      tam: 0.92 + ((h >> 16) % 16) / 100, fase: Math.random() * 10, foto: null,
      pos: PONTO.nascer.clone(), yaw: 0, quadro: 'mundo', pose: 'pe', chao: CALCADA_Y,
      caminho: null, pulo: -1, empurrao: -1, empDir: 1, dancaAte: 0, bracos: 0, sentar: 0, surgiu: 0, inclinar: 0, sumir: -1, ue: -1,
      ultimaAcao: estado.tempo, grande: 0, topo: new THREE.Vector3(), cabecaMundo: new THREE.Vector3(), temTopo: false, fotoC: new THREE.Vector3(), fotoR: 0,
      empresa: false, aroTrono: null,
      // Fase 4
      ritmo: 6.2 + ((h >>> 20) % 30) / 10,   // cada uma dança no seu ritmo
      gigK: 0, gigAlvo: 0, vipAte: 0, foiEmbora: false, anexo: null, anexoLocal: null,
      // Fase 5.1
      rua: false,          // anda junto com a rua (ficou para trás): fila do ponto, quem caiu, quem desceu
      cochilou: false, zzz: false, chaveEnfeite: '',
    };
    atualizarUser(c, user);
    return c;
  }
  // a foto pode chegar depois (outro evento com foto); nunca trava esperando
  function atualizarUser(c, user) {
    if (user.nome && user.nome !== c.user.nome && c.inst < 0) c.user.nome = user.nome;
    if (!user.foto || user.foto === c.user.foto) return;
    c.user.foto = user.foto; const url = user.foto;
    fotos.pedir(url, (cv) => {
      if (!cv || c.user.foto !== url) return;
      c.foto = cv;
      if (c.inst >= 0) desenharPlaca(c.inst, c);
      rotulos.fotoAtualizada(c);
    });
  }
  // comentário ou presente: "acorda" (zera o cochilo). Ser vítima de caos NÃO chama isto.
  function tocar(c) { c.ultimaAcao = estado.tempo; c.cochilou = false; c.zzz = false; }

  // ---------- caminhos (sem física: pontos + arcos) ----------
  const DOOR_IN = () => new THREE.Vector3(B.portaX, B.piso, 0.95);
  const DOOR_RUA = () => new THREE.Vector3(B.portaX, 0, 2.05);
  // Ajuste 17/11: queda padrão: pousa na rua, no vão entre a lateral do busão (z 1,35) e o meio-fio (z 2,65), e rola até x −17
  const Z_QUEDA = 2.05, QUEDA_SAIDA_X = -17;
  function criarCaminho(pts, arcos, quiques, vel, aoFim, eventos) {
    const dist = [0]; for (let i = 1; i < pts.length; i++) dist.push(dist[i - 1] + pts[i].distanceTo(pts[i - 1]) + (arcos[i - 1] || 0) * 0.8);
    return { pts, arcos, quiques, dist, total: dist[dist.length - 1], d: 0, vel, aoFim, eventos: eventos || {}, seg: 0, giro: false, giroSeg: -1, voltas: 1, espera: 0 };
  }
  // começa um caminho novo (zera o segmento para a cambalhota não herdar o caminho anterior)
  function andar(c, k) { c.caminho = k; c.segCaminho = -1; c.uCaminho = 0; return k; }
  const _a = new THREE.Vector3();
  function posNoCaminho(c, out) {
    const k = c.caminho; let s = 0;
    while (s < k.pts.length - 2 && k.d > k.dist[s + 1]) s++;
    const segLen = k.dist[s + 1] - k.dist[s] || 1e-6;
    const u = limitar((k.d - k.dist[s]) / segLen, 0, 1);
    out.lerpVectors(k.pts[s], k.pts[s + 1], u);
    c.chaoCaminho = out.y;
    out.y += Math.sin(Math.PI * u) * (k.arcos[s] || 0);
    if (k.quiques[s]) out.y += Math.abs(Math.sin((k.d - k.dist[s]) * Math.PI / 0.42)) * 0.13;

    _a.subVectors(k.pts[s + 1], k.pts[s]);

    if (s !== k.seg) { if (k.eventos[s]) k.eventos[s](); k.seg = s; }
    c.segCaminho = s; c.uCaminho = u;
    return u;
  }

  // lugar i da fila desenhada no ponto (já com o deslocamento do ponto na rua)
  function layoutPonto() { return PONTO.layout[estado.modo] || PONTO.layout.celular; }
  function visiveisNoPonto() { return CONFIG.viagem.visiveis[estado.modo] || 12; }
  function posicaoPonto(i, out) {
    const L = layoutPonto(); const lin = Math.min(Math.floor(i / L.porLinha), L.zs.length - 1), col = i - lin * L.porLinha;
    return (out || new THREE.Vector3()).set(PONTO.x0 - col * L.passo - (lin % 2) * L.passo * 0.5 + PONTO_DESL.x, CALCADA_Y, L.zs[lin]);
  }
  function posContador(out) { const L = layoutPonto(); return out.set(PONTO.contador.x + PONTO_DESL.x, 0, L.zs[L.zs.length - 1] + 0.8); }

  // ---------- ações ----------
  function listaPonto() { return filaEmbarque.length ? (esperando.length ? filaEmbarque.concat(esperando) : filaEmbarque) : esperando; }
  function totalPonto() { return filaEmbarque.length + esperando.length; }
  const naFila = (c) => c.estado === 'ponto';
  function tirarDaFila(c) {
    let i = filaEmbarque.indexOf(c); if (i >= 0) filaEmbarque.splice(i, 1);
    i = esperando.indexOf(c); if (i >= 0) esperando.splice(i, 1);
  }
  // está "a bordo": tem vaga (fora dos tronos ou nos tronos) e está nela, indo para ela ou empurrando o busão (pneu)
  function aBordo(c) { return !!c && !!c.vaga && c.vaga.ocupante === c && (c.estado === 'dentro' || c.estado === 'entrando' || c.estado === 'fora'); }

  // presente de entrar: Fase 5.1 = SOBE NA HORA (ver subirNaHora). eventos.entrar também cai aqui.
  function entrar(user, opcoes) { return subirNaHora(user, opcoes); }
  // quem comentou: vai para a FILA DO PRÓXIMO PONTO (no fim da fila). Passou do limite: fica só no placar (sem capivara na memória).
  function chegarNoPonto(user) {
    let c = porId.get(user.id);
    if (c) return c;
    if (totalPonto() >= CONFIG.viagem.limiteFila) { contadores.foraDoLimite++; return null; }
    c = novaCapivara(user); porId.set(user.id, c); esperando.push(c);
    return c;
  }
  function comentou(c) { tocar(c); }   // comentário de quem já está a bordo (ou na fila) só acorda; o balão é com os rótulos
  // quem tem prioridade (perdeu o trono, presente sem ninguém para empurrar) entra na fila cheia tirando o comentário mais novo
  // (que fica só no placar). Devolve false se não há como abrir espaço.
  function abrirEspacoNaFila() {
    if (totalPonto() < CONFIG.viagem.limiteFila) return true;
    const v = esperando.pop(); if (!v) return false;
    if (porId.get(v.user.id) === v) porId.delete(v.user.id);
    v.foiEmbora = true; if (v.inst >= 0) soltarInstancia(v); contadores.foraDoLimite++;
    return true;
  }
  function liberarVaga(c) {
    const v = c.vaga; if (!v) return; v.ocupante = null; c.vaga = null;
    // se saiu alguém do chão e tinha alguém em cima, o de cima desce
    if (v.emCima && v.emCima.ocupante) {
      const de = v.emCima.ocupante; v.emCima.ocupante = null; de.vaga = v; v.ocupante = de;
      if (de.estado === 'entrando' && de.caminho) {
        const k = de.caminho; k.pts[k.pts.length - 1] = new THREE.Vector3(v.x, v.y, v.z);
        for (let i = 1; i < k.pts.length; i++) k.dist[i] = k.dist[i - 1] + k.pts[i].distanceTo(k.pts[i - 1]) + (k.arcos[i - 1] || 0) * 0.8;
        k.total = k.dist[k.dist.length - 1];
      } else if (de.estado === 'dentro') {
        de.quadro = 'bus';
        andar(de, criarCaminho([de.pos.clone(), new THREE.Vector3(v.x, v.y, v.z)], [0.35], [false], 2.2, () => { de.caminho = null; de.pose = v.pose; }));
        de.pose = 'pe';
      }
      // 'fora' (empurrando o busão): só troca a vaga; na volta ele vai para a de baixo
    }
  }
  function sair(user, opcoes = {}) {
    const c = porId.get(user.id); if (!c) return false;
    porId.delete(user.id);
    if (c.estado === 'ponto') {
      let i = filaEmbarque.indexOf(c); if (i >= 0) filaEmbarque.splice(i, 1);
      i = esperando.indexOf(c); if (i >= 0) esperando.splice(i, 1);
      if (c.inst >= 0) irEmbora(c);

  // quem estava no ponto vai embora andando para a esquerda

      () => { saindo.delete(c); soltarInstancia(c); c.caminho = null; }));
  }
  function iniciarSaida(c, voltarFila) {
    const eraTeto = c.vaga && c.vaga.local === 'teto';

    // ponto de partida em coordenadas de mundo
    const ini = c.pos.clone(); if (c.quadro === 'bus') ini.applyMatrix4(busao.grupo.matrixWorld);
    c.quadro = 'mundo'; c.rua = !voltarFila;   // desceu de vez: fica para trás na rua (se o busão andar)
    const pts = [ini], arcos = [], qq = [];
    if (eraTeto) { pts.push(DOOR_RUA()); arcos.push(1.6); qq.push(false); }
    else if (ini.z < 2.0 && ini.y > B.piso - 0.3) {
      if (ini.distanceTo(DOOR_IN()) > 0.3) { pts.push(DOOR_IN()); arcos.push(0.2); qq.push(true); }
      pts.push(DOOR_RUA()); arcos.push(0.5); qq.push(false);
    } else if (ini.z < 2.2) { pts.push(new THREE.Vector3(ini.x, 0, 2.35)); arcos.push(0); qq.push(true); }   // estava atrás do busão (pneu)
    pts.push(new THREE.Vector3(B.portaX + 0.9, CALCADA_Y, 3.3)); arcos.push(0.3); qq.push(false);
    pts.push(new THREE.Vector3(8.5, CALCADA_Y, 3.4)); arcos.push(0); qq.push(true);

    andar(c, criarCaminho(pts, arcos, qq, 2.8, () => finalizarSaida(c, voltarFila)));
  }
  function finalizarSaida(c, voltarFila) {
    saindo.delete(c); soltarInstancia(c); c.caminho = null; c.rua = false;

      if (!abrirEspacoNaFila()) { if (porId.get(c.user.id) === c) porId.delete(c.user.id); c.foiEmbora = true; contadores.foraDoLimite++; return; }   // Fase 5.2: fila cheia: só no placar
      c.estado = 'ponto'; c.querEmbarcar = true; c.pos.copy(PONTO.nascer); c.quadro = 'mundo';

    }
  }

  // ======================================================================
  // Fase 5.1: SUBIR NA HORA (presente de entrar / escudo / qualquer presente sem efeito)
  // - com o busão andando: aparece na calçada, corre atrás do busão e pula para dentro (~1,5 s);
  // - com o busão parado no ponto: sai da frente da fila e entra pela porta;
  // - lotado por dentro: EMPURRA alguém EM PÉ (que é derrubado); ninguém em pé: teto (se tiver vaga); teto cheio: empurra alguém do teto;
  // - motorista e cobrador nunca são empurrados; o escudo segura o empurrão (e o empurrão tenta outra pessoa).
  // ======================================================================
  const ehRei = (c) => !!ganchos.ehRei && ganchos.ehRei(c.user.id);
  // passageiro "parado" na própria vaga (pode ser escolhido pelo caos / empurrão). Tronos, empresa e VIP ativo ficam de fora.
  function escolhivel(o, t) { return !!o && o.estado === 'dentro' && !o.caminho && !o.empresa && !(o.vipAte > t) && !!o.vaga && !o.vaga.trono && o.vaga.ocupante === o; }
  function ocupantes(lugar, t) {
    const l = [], m = estado.m;
    if (lugar !== 'teto') {
      for (let i = 0; i < Math.min(m.dentro, vagasDentro.length); i++) { const o = vagasDentro[i].ocupante; if (escolhivel(o, t) && (!lugar || lugarDe(o.vaga) === lugar)) l.push(o); }
      if (!lugar || lugar === 'sentado') { const o = vagaRei.ocupante; if (escolhivel(o, t)) l.push(o); }
    }
    if (!lugar || lugar === 'teto') for (let i = 0; i < Math.min(m.teto, vagasTeto.length); i++) { const o = vagasTeto[i].ocupante; if (escolhivel(o, t)) l.push(o); }
    return l;
  }
  // sorteia UMA pessoa para ser empurrada num lugar ('pe' ou 'teto'). Se ela tem escudo, o escudo estoura e ela fica
  // (o empurrão "gasta" a vez, como o caos): quem chegou tenta o próximo passo (teto, empurrar no teto ou esperar o ponto).
  let empurradoForcado = null;   // só para testes
  // para o empurrão vale também quem ainda está chegando na vaga (numa enxurrada de presentes, quem acabou de subir também pode ser empurrado)
  function empurraveis(lugar, t) {
    const l = [], m = estado.m;
    const lista = lugar === 'teto' ? vagasTeto.slice(0, m.teto) : vagasDentro.slice(0, m.dentro);
    for (const v of lista) {
      const o = v.ocupante;
      if (o && o.vaga === v && !o.empresa && !(o.vipAte > t) && !o.voltandoEmpurrao && (o.estado === 'dentro' || o.estado === 'entrando') && lugarDe(v) === lugar) l.push(o);
    }
    return l;
  }
  function escolherEmpurrado(lugar, quem) {
    const t = estado.tempo; const l = empurraveis(lugar, t);
    if (!l.length) return null;
    let i = empurradoForcado ? l.indexOf(empurradoForcado) : -1; empurradoForcado = null;
    if (i < 0) i = (Math.random() * l.length) | 0;
    const v = l[i];
    if (ganchos.usarEscudo && ganchos.usarEscudo(v, 'empurrao', quem)) return null;   // SEGUROU!
    return v;
  }
  function subirNaHora(user, opcoes = {}) {
    let c = porId.get(user.id);
    if (c) {
      atualizarUser(c, user);
      if (aBordo(c)) { animar.pular(c); return 'ja-dentro'; }
      if (naFila(c)) tirarDaFila(c);
    } else { c = novaCapivara(user); porId.set(user.id, c); }
    tocar(c); c.querEmbarcar = false;
    const rei = ehRei(c);
    // escolhe a vaga: o rei vai direto para o Banco do Rei; os outros por dentro → (lotado) empurra em pé → teto → empurra no teto
    let v = rei && !vagaRei.ocupante ? vagaRei : vagaLivreDentro(), vitima = null;
    const lotado = !vagaLivreDentro();
    if (rei && lotado) vitima = escolherEmpurrado('pe', user);   // volta triunfal: com o busão lotado ele empurra alguém mesmo assim
    if (!v) {
      vitima = escolherEmpurrado('pe', user);
      if (!vitima) v = vagaLivreTeto();
      if (!v && !vitima) vitima = escolherEmpurrado('teto', user);
    }
    if (vitima) {
      derrubar(vitima, 'empurrao', { espera: viagem.parado ? 0.7 : 1.0, autor: user });
      contadores.empurroes++;
      if (!v) v = vagaLivre();
    }
    if (!v) {   // ninguém para empurrar (o escudo segurou): espera o próximo ponto, na frente da fila
      if (!abrirEspacoNaFila()) {   // fila cheia só de gente com prioridade: fica só no placar (sem capivara na memória)
        if (porId.get(user.id) === c) porId.delete(user.id); if (c.inst >= 0) soltarInstancia(c);

    c.estado = 'entrando'; c.vaga = v; v.ocupante = c; c.alvoPonto = null; c.rua = false; saindo.delete(c); c.sumir = -1;
    cobrarSePassa(c, v);   // Fase 5.2: entra pela porta e passa pela catraca = paga passagem (o teto e o Banco do Rei não passam)
    const parado = viagem.parado;
    if (c.inst < 0) {
      c.quadro = 'mundo';
      if (parado) posicaoPonto(0, c.pos).x += 0.55;                                       // sai da frente da fila
      else c.pos.set(-7.4, CALCADA_Y, 3.55);                                              // aparece na calçada, atrás do busão
      if (!pegarInstancia(c)) { colocarNaVaga(c); return 'subiu'; }
    }
    ganchos.aoEmbarcar && ganchos.aoEmbarcar(c);
    const ini = posMundo(c, new THREE.Vector3()); c.quadro = 'mundo'; c.pos.copy(ini); c.pose = 'pe'; c.andando = false;
    const dest = new THREE.Vector3(v.x, v.y, v.z);
    const pts = [ini], arcos = [], qq = [], ev = {};
    let giro = false;
    if (parado) {   // entra pela porta normalmente
      pts.push(new THREE.Vector3(B.portaX, CALCADA_Y, 2.95)); arcos.push(0); qq.push(true);
    } else {        // corre atrás do busão
      pts.push(new THREE.Vector3(B.portaX - 1.4, CALCADA_Y, 3.15)); arcos.push(0); qq.push(true);
    }
    if (v.local === 'teto') { pts.push(DOOR_RUA()); arcos.push(0.25); qq.push(false); pts.push(dest); arcos.push(2.4); qq.push(false); giro = true; }
    else {
      pts.push(DOOR_RUA()); arcos.push(parado ? 0.25 : 0.5); qq.push(false);
      pts.push(DOOR_IN()); arcos.push(0.45); qq.push(false);
      if (v.x < B.catracaX) { pts.push(new THREE.Vector3(B.catracaX, B.piso, 0.45)); arcos.push(0); qq.push(true); ev[pts.length - 2] = () => passarCatraca(c); }
      pts.push(dest); arcos.push(v.tipo === 'empilhado' ? 0.7 : 0.35); qq.push(false);
    }

  // perdeu o trono: levanta, faz "ué!" e vai para o corredor (ou teto, ou a frente da fila)

  // o ponto saiu de cena: a fila continua (para o próximo ponto), mas sem desenho
  function esconderFila() { for (const c of listaPonto()) if (c.inst >= 0 && !c.caminho) soltarInstancia(c); }
  // parou no ponto: quem cochilou desce ("Zzz… perdi o ponto!")
  function descerCochilados() {
    const lista = [];

  }
  // Banco do Rei: o 1º do placar senta ali quando está a bordo (troca de lugar com quem estiver); quem não é mais rei sai do banco

  function redesenhar(c) { if (c && c.inst >= 0 && !c.empresa) desenharPlaca(c.inst, c); }

  // ---------- Fase 5.1: ninguém desce por tempo; só COCHILO (sem interagir) e a fila do ponto ----------
  let proxVerif = 0;
  function verificarTempos(t) {

    const limC = PL.cochiloMin * fator, avisoC = Math.max(0, PL.cochiloMin - 1) * fator, limP = PL.pontoMin * fator;

    }
  }

  function esvaziar(voltarFila = false) {
    let k = 0;

      if (c.estado === 'dentro' || c.estado === 'entrando' || c.estado === 'fora') {
        if (!voltarFila) { porId.delete(c.user.id); c.foiEmbora = true; }
        const atraso = (k++) * 0.04;

  }
  function zerarTudo() {

  }
  // troca de modo: quem está em vaga acima do novo limite volta pra fila (os tronos ficam fora disso)
  function aplicarLimites() {
    const m = estado.m; let n = 0;
    for (const v of [...vagasDentro.slice(m.dentro), ...vagasTeto.slice(m.teto)]) if (v.ocupante) { v.reservada = null; iniciarSaida(v.ocupante, true); n++; }
    return n;
  }

  // ---------- animações ----------
  const animar = {
    pular(c) { c.pulo = estado.tempo; },
    empurrar(c, dir = 1) { c.empurrao = estado.tempo; c.empDir = dir; },
    dancar(c, seg = 5) { c.dancaAte = estado.tempo + seg; },
    ue(c) { c.ue = estado.tempo; },

  // ---------- atualização por quadro ----------
  const _root = new THREE.Matrix4(), _loc = new THREE.Matrix4(), _out = new THREE.Matrix4();
  const _q = new THREE.Quaternion(), _e = new THREE.Euler(0, 0, 0, 'YXZ'), _p = new THREE.Vector3(), _s = new THREE.Vector3(), _v = new THREE.Vector3();

  function compor(out, px, py, pz, rx, ry, rz, sx, sy, sz) { _e.set(rx, ry, rz); _q.setFromEuler(_e); _p.set(px, py, pz); _s.set(sx, sy, sz); return out.compose(_p, _q, _s); }

  function atualizar(dt, t) {
    verificarTempos(t);
    const restante = processarFila(t);
    // Fase 5.1: o que está na calçada (fila do ponto, quem caiu, quem desceu) anda junto com a rua e fica para trás
    const dxRua = -CONFIG.velocidadeRua * estado.velRua * dt;
    // movimento de quem está no ponto
    for (const c of visiveis) {
      if (dxRua !== 0 && c.quadro === 'mundo' && (c.rua || c.estado === 'ponto')) {
        c.pos.x += dxRua;
        if (c.caminho) { const pp = c.caminho.pts; for (let j = 0; j < pp.length; j++) pp[j].x += dxRua; }
        if (c.rua && c.pos.x < -16 && c.sumir < 0) c.sumir = t;   // saiu de cena pela esquerda
      }
      if (c.estado === 'ponto' && c.alvoPonto && !c.caminho) {
        const d = c.pos.distanceTo(c.alvoPonto);
        if (d > 0.02) {
          const passo = Math.min(d, 2.4 * dt); _v.subVectors(c.alvoPonto, c.pos).normalize();
          c.pos.addScaledVector(_v, passo); c.andando = true; c.yawAlvo = Math.atan2(_v.x, _v.z) * 0.7;
        } else { c.andando = false; c.yawAlvo = 0.25; }
      }
      if (c.caminho) {
        const k = c.caminho;
        if (k.espera > 0) k.espera -= dt;
        else {
          k.d += k.vel * dt * (k.rolaSeg != null && c.segCaminho === k.rolaSeg ? 0.55 : 1);   // rolando: mais devagar (a rua já leva para trás)
          posNoCaminho(c, c.pos);
          if (k.rolaSeg != null && c.segCaminho === k.rolaSeg) c.yawAlvo = 0;   // rolando: de frente para a câmera
          if (k.d >= k.total) { const f = k.aoFim; c.pos.copy(k.pts[k.pts.length - 1]); f && f(); }
        }
      }
    }
    _qCam.copy(camera.quaternion);
    const busM = busao.grupo.matrixWorld;
    const ESCALA = ESC;
    const tamPequena = CONFIG.placas.pequena, fotoMax = CONFIG.placas.pequenaMaxTela;
    const camPos = camera.position;
    const escGig = CONFIG.caos.gigante.escala - 1;
    const temGigante = fx.gigantes.length > 0;
    const buracoVivo = t - fx.buracoT < 1.3, lombadaViva = t - fx.lombadaT < 2.6;
    let coroaVis = false;
    for (const c of visiveis) {
      if (c.inst < 0) continue;
      const i = c.inst;
      // pop de entrada / sumiço
      let esc = c.tam * ESCALA;

      let x = c.pos.x, y = c.pos.y, z = c.pos.z, rz = 0, rx = 0, sy = 1, wx = 1;

          else if (noTeto) { x += limitar((4.4 - px) * 0.32, 0, 2.8) * f * F; y += Math.sin(f * Math.PI) * 0.55 + 0.12 * f; rz -= 1.15 * f; }   // quase cai

      }
      // Ajuste 17/11: queda padrão: rolando pela rua (gira em volta da barriga, não dos pés: não entra no chão)
      let rolX = 0, rolY = 0;
      if (c.caminho && c.caminho.rolaSeg != null && c.segCaminho === c.caminho.rolaSeg) {

            } else {
              let ang = 0.5 + b * 2.1;

              else if (noTeto) ang += 0.25 + Math.sin(t * 5.3 + fase + l * 1.7) * 0.18;  // braços esticados, balançando no vento
              else if (ue) ang += Math.sin(t * 22 + l * 2) * 0.15;                        // sacode os bracinhos
              L = compor(_loc, 0.4 * sx, 0.62 + b * 0.32, 0.06 + (noTeto ? 0.12 : 0), 0, 0, ang * sx, 0.1, 0.22, 0.1);
            }

            const sx = l === 1 ? -1 : 1; const s = c.sentar;

      const chaoY = c.caminho ? Math.min(c.chaoCaminho ?? c.pos.y, c.pos.y) : c.pos.y;

    manchas.count = n; manchas.instanceMatrix.needsUpdate = true;
    placas.count = n; placas.instanceMatrix.needsUpdate = true;

    void el.offsetWidth; el.classList.add('ver');
    let seg = item.tam === 'grande' ? TL.anuncioGrandeSeg : TL.anuncioCompactoSeg;
    if (item.urgente && item.ms != null) seg = item.ms / 1000;   // "ABAIXA!": o tempo do aviso
    ate = t + (fila.length >= 2 && !item.urgente ? seg * 0.8 : seg);
    cont.mostrados++;
  }
  // faixa do anúncio (px): de --zAnuncio até CONFIG.tela.zonas.anuncioFim
  function medirZona() {
    const W = estado.palcoW, H = estado.palcoH;
    zonaA.y0 = CONFIG.tela.zonas.tronosFim * H + W * 0.008; zonaA.alt = CONFIG.tela.zonas.anuncioFim * H - zonaA.y0 - W * 0.006; zonaA.larg = W * 0.96;
    if (fase === 'mostrando') medir();
  }
  // mede uma vez por anúncio e encolhe para caber na faixa
  function medir() {
    const W = estado.palcoW;
    const w = el.offsetWidth, h = el.offsetHeight;
    const esc = Math.min(1, zonaA.larg / Math.max(1, w), zonaA.alt / Math.max(1, h));
    el.style.setProperty('--esc', esc.toFixed(3));
    ret.x0 = W / 2 - w * esc / 2; ret.x1 = W / 2 + w * esc / 2; ret.y0 = zonaA.y0; ret.y1 = zonaA.y0 + h * esc;
  }
  // caos: o combo cresceu. Se o anúncio ainda vai aparecer, só soma; se está na tela, atualiza o número.
  // Devolve false se ele já saiu da tela (aí o caos manda um anúncio novo com o combo atual).
  function somarCombo(item, n, nome) {

    d.combo += n;
    if (nome) { d.nomes = d.nomes || [d.nome]; if (!d.nomes.includes(nome)) d.nomes.push(nome); }
    if (d === atual && fase === 'mostrando') {
      if (d.tam === 'compacto') textoCompacto(d); else eResto.textContent = textoCombo(d.combo);
      medir(); ate = Math.max(ate, estado.tempo + 1.0);
    }
    return true;
  }
  // a janela só sabe quem voou depois do sorteio (só aparece no anúncio grande)
  function definirVoou(item, nome) {
    const d = destino(item); if (d.feito) return; d.voou = nome;
    if (d === atual && fase === 'mostrando' && d.tam === 'grande') { el.classList.add('comTirou'); eNome2.textContent = '@' + nome; eDe.textContent = 'voou!'; medir(); }
  }
  function atualizar(t) {
    if (fase === 'mostrando' && t >= ate) { el.classList.remove('ver'); fase = 'saindo'; ate = t + 0.3; if (atual) atual.feito = true; }
    else if (fase === 'saindo' && t >= ate) { fase = 'livre'; atual = null; }
    if (fase === 'livre' && fila.length) mostrar(fila.shift(), t);
  }
  // Fase 5.2: aviso que não pode esperar ("ABAIXA!"): vai para a frente da fila e encurta o anúncio que está na tela
  function urgente(item) {
    item.extra = 0; item.urgente = true; item.tam = 'grande'; fila.unshift(item); cortarFila();
    if (fase === 'mostrando' && atual && atual !== item) ate = Math.min(ate, estado.tempo + 0.05);
  }
  return {
    enfileirar, atualizar, somarCombo, definirVoou, cont, urgente, medirZona, tamanho,
    retangulo() { return fase === 'livre' ? null : ret; },
    pendentes() { return fila.length; },
    get fila() { return fila; },
    get atual() { return atual; }, get fase() { return fase; },
  };
})();
// avisos simples (modo, busão vazio etc.) entram na mesma fila. Fase 5.1: estilo ('rei', 'queda', 'ponto') e fixo.
// Fase 5.3: 'queda', 'perigo' e os do Rei marcados como fixos são GRANDES; o resto é compacto (uma linha).
function anunciar(texto, ms = 2600, estilo = '', fixo = false) { anuncios.enfileirar({ tipo: 'texto', texto, ms, estilo, fixo }); }

/* =====================================================================
   TRONOS (Motorista e Cobrador): tomados por presente
   ===================================================================== */
const tronos = (() => {
  const TC = CONFIG.tronos;
  // Fase 5.2: sentou = quando o dono SENTOU no trono (null = ainda andando até lá); derrubados = quantas vezes derrubaram o dono
  const lista = capivaras.vagasTrono.map((vaga, i) => ({ nome: vaga.trono, i, vaga, dono: null, desde: 0, sentou: null, protegidoAte: -99, fila: [], empresa: null, derrubados: 0 }));
  const por = { motorista: lista[0], cobrador: lista[1] };
  const cont = { trocas: 0, repetidos: 0, enfileirados: 0, jaNaFila: 0, derrubados: 0 };

  // ---------- Fase 5.2: trono com risco ----------
  // segundos desde que o dono sentou (0 se não tem dono de verdade ou se ele ainda está andando até o trono)
  function tempoSentado(T) { return T && T.dono && T.sentou != null ? Math.max(0, estado.tempo - T.sentou) : 0; }
  // peso para ser sorteado num caos (mesma escala de CONFIG.caos.pesoLugar): 0 no minuto imune, depois 0,1 … 0,5
  function pesoDe(s) {
    if (s < TC.imuneSeg) return 0;
    const degrau = 1 + Math.floor((s - TC.imuneSeg) / TC.passoSeg);
    return Math.min(TC.pesoMax, Math.round(degrau * TC.pesoPasso * 1000) / 1000);
  }
  function peso(nome) { const T = por[nome]; return T && T.dono && T.sentou != null ? pesoDe(tempoSentado(T)) : 0; }
  // para o selo e o painel: { sentado, imune, resta (s do minuto imune), peso, degrau (1…), max }
  function fase(nome) {
    const T = por[nome];
    if (!T || !T.dono || T.sentou == null) return { sentado: false, imune: false, resta: 0, peso: 0, degrau: 0, max: false };
    const s = tempoSentado(T), p = pesoDe(s);
    return { sentado: true, imune: s < TC.imuneSeg, resta: Math.max(0, TC.imuneSeg - s), peso: p, degrau: Math.round(p / TC.pesoPasso), max: p >= TC.pesoMax - 1e-9 };
  }
  // quanto o tempo dt no trono vale no placar: metade no minuto imune, inteiro depois (dividido certinho na virada)
  function valorPlacar(nome, dt) {
    const T = por[nome]; if (!T || !T.dono || T.sentou == null) return 0;
    const s1 = tempoSentado(T), s0 = Math.max(0, s1 - dt);
    const imune = Math.max(0, Math.min(s1, TC.imuneSeg) - s0);
    return imune * TC.placarImune + (s1 - s0 - imune) * TC.placarDepois;
  }
  // só para testes / simulador: faz de conta que o dono sentou há "seg" segundos
  function forcarTempo(nome, seg) { const T = por[nome]; if (!T || !T.dono) return false; if (T.sentou == null) capivaras.colocarNaVaga(T.dono); T.sentou = estado.tempo - seg; return true; }
  // o cobrador de verdade (pessoa da LIVE; o da empresa não conta)
  function cobrador() { const T = por.cobrador; return T.dono && T.vaga.ocupante === T.dono ? T.dono : null; }
  // o dono foi DERRUBADO (caos ou perigo do caminho): anúncio, e o trono passa para o próximo da fila do trono (ou para a empresa)
  function derrubado(nome, c, autor, perigo) {
    const T = por[nome]; if (!T || T.dono !== c) return;
    marcarAro(c, null); T.dono = null; T.sentou = null; T.derrubados++; cont.derrubados++;
    const cargo = nome === 'motorista' ? 'MOTORISTA' : 'COBRADOR';
    anunciar((autor ? '@' + autor.nome : 'O ' + (perigo || 'GALHO')) + ' DERRUBOU O ' + cargo + '!', 3200, 'queda', true);
    log((autor ? '@' + autor.nome : (perigo || 'galho').toLowerCase()) + ' derrubou o ' + nome + ' @' + c.user.nome);
    if (T.fila.length) { T.protegidoAte = -99; aplicar(T, T.fila.shift()); }        // o próximo da fila do trono senta
    else if (!T.vaga.ocupante) T.empresa = capivaras.criarEmpresa(T.vaga, true);   // fila vazia: o funcionário da empresa senta
  }

  function iniciar() { for (const T of lista) if (!T.vaga.ocupante) T.empresa = capivaras.criarEmpresa(T.vaga, false); }
  function marcarAro(c, nome) {
    if (!c || c.aroTrono === nome) return;
    c.aroTrono = nome; if (c.inst >= 0) capivaras.desenharPlaca(c.inst, c);
  }
  // mesma pessoa manda de novo o presente do trono que já é dela: pulinho + brilho, o tempo continua
  function mesmaPessoa(T, c) {
    capivaras.tocar(c); capivaras.animar.pular(c); rotulos.brilhar(c); som.brilho(); cont.repetidos++;
    log('@' + c.user.nome + ' já é o ' + T.nome + ' (pulinho)');
  }
  function pedir(nome, user) {
    const T = por[nome]; if (!T) return;
    const c0 = capivaras.porId.get(user.id);
    if (!T.fila.length && c0 && c0 === T.dono) { capivaras.atualizarUser(c0, user); mesmaPessoa(T, c0); return; }
    const ult = T.fila[T.fila.length - 1];
    if (ult && ult.id === user.id) { cont.jaNaFila++; if (c0) { capivaras.tocar(c0); capivaras.animar.pular(c0); } return; }   // já está na fila do trono
    if (estado.tempo < T.protegidoAte || T.fila.length) {
      T.fila.push(user); cont.enfileirados++;
      if (c0) { capivaras.tocar(c0); capivaras.animar.pular(c0); }
      log('trono ' + T.nome + ' protegido: @' + user.nome + ' na fila (' + T.fila.length + ')');
      return;
    }
    aplicar(T, user);
  }
  function aplicar(T, user) {
    const t = estado.tempo;
    const c = capivaras.garantir(user);
    if (c === T.dono) { mesmaPessoa(T, c); return; }
    const outro = lista[1 - T.i];
    if (outro.dono === c) { marcarAro(c, null); outro.dono = null; }   // trocou de trono: o outro fica vago (a empresa volta)
    const antigo = T.dono;
    if (antigo) { marcarAro(antigo, null); const foi = capivaras.perderTrono(antigo); som.ih(); log('@' + antigo.user.nome + ' perdeu o ' + T.nome + ' → ' + foi); }
    else if (T.vaga.ocupante && T.vaga.ocupante.empresa) capivaras.mandarEmbora(T.vaga.ocupante);
    T.empresa = null;
    marcarAro(c, T.nome);
    T.dono = c; T.desde = t; T.sentou = null; cont.trocas++;
    capivaras.irParaTrono(c, T.vaga, () => chegou(T, c));
    T.protegidoAte = t + (T.fila.length > 3 ? TC.protecaoFilaLongaSeg : TC.protecaoSeg);
    anuncios.enfileirar({ tipo: 'trono', trono: T.nome, nome: c.user.nome, capi: c, tirouNome: antigo ? antigo.user.nome : null });
    cameraDiretora.pedir({ tipo: 'trono', trono: T.nome, alvoCapi: c, chave: 'trono:' + T.nome });
    rotulos.destacar(c); rotulos.brilhar(c); som.whoosh();
    log('@' + c.user.nome + ' agora é o ' + T.nome.toUpperCase() + (antigo ? ' (tirou @' + antigo.user.nome + ')' : ''));
  }
  // chegou na cadeira: motorista buzina (o busão sacode de leve); cobrador gira a catraca com moedas
  function chegou(T, c) {
    if (T.dono !== c) return;
    T.sentou = estado.tempo;   // Fase 5.2: o minuto imune começa agora
    if (T.nome === 'motorista') { som.buzina(); busao.buzinar(0.9); busao.sacudir(0.9); }
    else { busao.girarCatraca(3); som.moedas(); }
  }
  function atualizar(t) {
    for (const T of lista) {
      const d = T.dono;
      // o dono saiu (foi embora da LIVE, esvaziou o busão…): a capivara da empresa volta
      if (d && (T.vaga.ocupante !== d || capivaras.porId.get(d.user.id) !== d)) {
        marcarAro(d, null); T.dono = null; T.sentou = null; log('@' + d.user.nome + ' saiu do ' + T.nome + ': volta a capivara da empresa');
      }
      if (!T.dono && !T.vaga.ocupante) T.empresa = capivaras.criarEmpresa(T.vaga, true);
      if (T.fila.length && t >= T.protegidoAte) aplicar(T, T.fila.shift());
    }
  }
  function segundos(nome) { const T = por[nome]; return T && T.dono ? estado.tempo - T.desde : 0; }
  function zerar() { for (const T of lista) T.fila.length = 0; }
  return { iniciar, pedir, atualizar, segundos, zerar, cont, lista, por, get trocas() { return cont.trocas; },
    // Fase 5.2
    peso, pesoDe, fase, valorPlacar, tempoSentado, forcarTempo, cobrador, derrubado };
})();

/* =====================================================================
   CAOS (Fase 4): a regra de cada presente de caos
   - Gerais (mexem com todo mundo): freada, buraco, lombada, fiscal, pagode, pneu
     → entram na FILA DE CAOS e acontecem um depois do outro, com um respiro curto.
   - Pessoais: janela, gigante, vip, buzinaço → podem acontecer junto com um geral.
   - Combo: o mesmo presente seguido (ou qtd > 1) não repete o efeito: deixa mais forte/longo (até comboMax).
   - Nada se perde: passando do limite da fila, os iguais se juntam (e contam).
   O movimento das capivaras fica no bloco "capivaras"; aqui só a regra, o tempo, a câmera, o som e o anúncio.
   ===================================================================== */
const caos = (() => {

  for (const k of TODOS) { cont.recebidos[k] = 0; cont.executados[k] = 0; }
  const fila = []; let atual = null; let proxGeral = 0;
  const pessoais = {}; for (const k of PESSOAIS) pessoais[k] = { atual: null, fila: [] };
  const vipsAtivos = [];
  const nivel = (it) => Math.min(it.combo, CC.comboMax);   // 1 … comboMax
  let nItem = 0;

  // holofote do VIP (cone de luz falso + mancha clara no chão; nenhuma luz real nova)
  const cone = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 1.05, 6.6, 18, 1, true).translate(0, -3.3, 0),

  cone.renderOrder = 4; luzChao.renderOrder = 1; cone.visible = luzChao.visible = false; cone.frustumCulled = luzChao.frustumCulled = false;
  cena.add(cone, luzChao);
  // notinhas musicais do pagode (uma textura desenhada uma vez + 14 instâncias)
  const cn = document.createElement('canvas'); cn.width = cn.height = 64; const gn = cn.getContext('2d');
  gn.fillStyle = '#fff'; gn.strokeStyle = '#fff'; gn.lineWidth = 6;

  gn.beginPath(); gn.moveTo(29, 46); gn.lineTo(29, 10); gn.lineTo(55, 4); gn.lineTo(55, 38); gn.stroke();
  gn.fillRect(27, 8, 30, 8);
  const texNota = new THREE.CanvasTexture(cn);

  for (let i = 0; i < N_NOTAS; i++) notas.setColorAt(i, new THREE.Color(CORES_NOTA[i % CORES_NOTA.length]));
  notas.visible = false; notas.frustumCulled = false; notas.renderOrder = 5; cena.add(notas);
  // prancheta do fiscal (presa na mão dele)
  const prancheta = new THREE.Mesh(mesclar([caixaColorida(-0.16, 0.16, -0.22, 0.22, -0.02, 0.02, 0x8d6e63), caixaColorida(-0.13, 0.13, -0.17, 0.18, 0.02, 0.035, 0xffffff),
    caixaColorida(-0.06, 0.06, 0.18, 0.24, -0.03, 0.04, 0x9e9e9e)]), new THREE.MeshLambertMaterial({ vertexColors: true }));
  prancheta.matrixAutoUpdate = false; prancheta.visible = false; prancheta.frustumCulled = false; cena.add(prancheta);
  const PRANCHETA_LOCAL = new THREE.Matrix4().compose(new THREE.Vector3(0.36, 0.72, 0.34), new THREE.Quaternion().setFromEuler(new THREE.Euler(-0.5, 0.3, 0.2)), new THREE.Vector3(1, 1, 1));

  const _m = new THREE.Matrix4(), _p = new THREE.Vector3(), _s = new THREE.Vector3(), _q = new THREE.Quaternion();
  function atualizarNotas(t, env) {
    if (env <= 0.01) { if (notas.visible) notas.visible = false; return; }
    notas.visible = true; _q.copy(camera.quaternion);
    for (let i = 0; i < N_NOTAS; i++) {
      const p = (t * 0.42 + i / N_NOTAS) % 1;
      const x = -4.6 + ((i * 0.618) % 1) * 9.4 + Math.sin(t * 2.6 + i) * 0.25;
      _p.set(x, 2.7 + p * 3.4, 1.0 + Math.sin(i * 1.7) * 0.5);
      const e = Math.sin(p * Math.PI) * env * (0.8 + (i % 3) * 0.15);
      _s.set(e, e, e); notas.setMatrixAt(i, _m.compose(_p, _q, _s));

  }

  // ---------- ajudantes ----------
  const capiDe = (user) => capivaras.porId.get(user.id) || null;
  const vivo = (c) => !!c && capivaras.porId.get(c.user.id) === c;
  function pedirTomada(tipo, it, extra = {}) {
    cameraDiretora.pedir(Object.assign({ tipo, chave: 'caos:' + tipo + (extra.alvoCapi ? ':' + extra.alvoCapi.user.id : '') }, extra));
  }
  function anunciarCaos(it, voou) {

  const envelope = (s, r, sobe, desce) => Math.min(suave(limitar(s / sobe, 0, 1)), suave(limitar(r / desce, 0, 1)));

  // ---------- Fase 5.1: DERRUBADAS ----------
  // o lugar importa: sentado = metade da chance, em pé = normal, teto = o dobro (CONFIG.caos.pesoLugar)
  // Fase 5.2: o dono do trono tem peso próprio (0 no minuto imune, depois 0,1 … 0,5: ver CONFIG.tronos)
  const peso = (c) => { if (c.vaga && c.vaga.trono) return tronos.peso(c.vaga.trono); const p = CC.pesoLugar[capivaras.lugarDe(c.vaga)]; return p == null ? 1 : p; };
  // candidatos de um caos: os passageiros do lugar pedido + (Fase 5.2) os donos dos tronos, menos no TETO (lombada, perigos).
  // Dono de trono no minuto imune (peso 0) não entra. A capivara da empresa e o VIP ativo nunca entram.
  function candidatos(onde, t) {
    const l = capivaras.ocupantes(onde, t);
    if (onde !== 'teto') for (const T of tronos.lista) {
      const o = T.dono;
      if (o && !o.empresa && o.estado === 'dentro' && !o.caminho && o.vaga === T.vaga && T.vaga.ocupante === o && !(o.vipAte > t) && tronos.peso(T.nome) > 0) l.push(o);
    }

  }
  function sortearPonderado(lista) {
    let tot = 0; for (const c of lista) tot += peso(c);
    let r = Math.random() * tot;
    for (let i = 0; i < lista.length; i++) { r -= peso(lista[i]); if (r <= 0) return i; }
    return lista.length - 1;
  }
  let alvoForcado = null;   // só para o simulador ("Derrubar o rei"): a próxima derrubada escolhe esta capivara primeiro
  // quantos o efeito derruba agora: sorteio min–max + 1 por nível de combo, com teto por efeito
  function alvoDerrubar(it) {

  }
  // sorteia até n vítimas (quem tem escudo segura e GASTA a vaga do efeito; no trono o escudo fica guardado e não vale)
  function sortearVitimas(it, n, onde, sem) {
    const t = estado.tempo, lista = candidatos(onde, t), vit = [];
    if (sem) for (const c of sem) { const j = lista.indexOf(c); if (j >= 0) lista.splice(j, 1); }
    it.tentativas = it.tentativas || 0;
    while (n > 0 && lista.length) {
      let i = alvoForcado ? lista.indexOf(alvoForcado) : -1;
      if (i < 0) i = sortearPonderado(lista); else alvoForcado = null;
      const c = lista[i]; lista.splice(i, 1); n--; it.tentativas++;

  // derruba de verdade (com um pequeno intervalo entre um e outro)
  function executar(it, vit, jeito, opcoes = {}) {

  // ---------- Fase 5.2: o COBRADOR "segura" 1 vítima a cada 3 caos que derrubam gente ----------
  // O contador é do TRONO (troca de cobrador não zera) e só anda com cobrador de verdade sentado.
  // O caos acontece normalmente; só a vítima segurada balança e não cai. Nunca segura o próprio cobrador e não gasta escudo.
  const segura = { contados: 0, pendente: false, seguradas: 0 };
  function talvezSegurar(it, vit) {
    const cob = tronos.cobrador();
    if (!cob || cob.estado !== 'dentro' || tronos.por.cobrador.sentou == null || !vit.length) return vit;
    segura.contados++;
    if (segura.contados % CONFIG.cobrador.seguraCada === 0) segura.pendente = true;
    if (!segura.pendente) return vit;
    const i = vit.findIndex((c) => c !== cob); if (i < 0) return vit;   // só o próprio cobrador caiu: fica para o próximo caos
    const salvo = vit[i]; segura.pendente = false; segura.seguradas++;
    capivaras.animar.empurrar(salvo, Math.random() < 0.5 ? -1 : 1); capivaras.animar.ue(salvo);   // balança, faz "ué!" e fica
    rotulos.efeito(salvo, 'segura', 'SEGURA AÍ!'); som.segura();   // Fase 5.3: balãozinho colado em quem foi SALVO
    it.segurou = salvo;
    log('cobrador @' + cob.user.nome + ' segurou @' + salvo.user.nome + ' (' + it.tipo + ')');
    return vit.filter((c) => c !== salvo);
  }
  // combo depois da derrubada: derruba mais até o novo alvo
  function derrubarMais(it, jeito, onde, opcoes) {
    if (!it.derrubou) return;

    if (falta > 0) { it.feitas = alvo; derrubarN(it, falta, jeito, onde, opcoes); }
  }
  // a derrubada principal do caos (uma vez por caos). opcoes.tetoExtra (freada): + N do teto, dentro do maxDerrubados
  function derrubarAgora(it, jeito, onde, opcoes = {}) {
    if (it.derrubou) return; it.derrubou = true;
    it.feitas = alvoDerrubar(it);
    let vit;
    if (opcoes.tetoExtra) {
      const nTeto = capivaras.ocupantes('teto', estado.tempo).length ? opcoes.tetoExtra : 0;
      const max = CC.maxDerrubados[it.tipo] ?? 99, nPe = Math.max(0, Math.min(it.feitas, max - nTeto));
      it.feitas = nPe + nTeto;

    return executar(it, talvezSegurar(it, vit), jeito, opcoes);
  }

      estende: (it, t) => t < it.fim - 0.4,
      passo(it, t) {
        fx.tampa = Math.max(fx.tampa, envelope(t - it.inicio, it.fim - t, 0.25, 0.4));
        if (t >= it.proxBuzina && it.fim - t > 0.2) { som.buzinaCurta(); busao.sacudir(0.25); it.proxBuzina += 0.42; }
        return t >= it.fim;
      },
      fim() {},
    },
  };

  // ---------- receber um presente de caos ----------
  let moedasAgora = 0;   // Fase 5.3: moedas do presente que mandou este caos (a LIVE manda; sem valor, usa CONFIG.tela.moedasEfeito)
  function novoItem(tipo, user, capi, qtd, chave) {
    return { id: ++nItem, tipo, user: { id: user.id, nome: user.nome, foto: user.foto }, capi, combo: qtd, chave, criado: estado.tempo, ativo: false, an: null, moedas: moedasAgora, nomes: [user.nome] };
  }
  function somarCombo(it, qtd, t, user) {
    it.combo += qtd; cont.combos += qtd;
    if (user && !it.nomes.includes(user.nome)) it.nomes.push(user.nome);   // Fase 5.3: o anúncio compacto credita todo mundo ("@A, @B +3")
    if (!it.ativo) return;
    EF[it.tipo].combo(it, t);
    if (it.an && !anuncios.somarCombo(it.an, qtd, user && user.nome)) anunciarCaos(it, it.an.voou);   // o anúncio já tinha saído: vem outro com o número novo
  }
  function receber(tipo, user, qtd = 1, moedas = 0) {
    if (!EF[tipo]) return;
    moedasAgora = moedas || 0;
    const t = estado.tempo; qtd = Math.max(1, qtd | 0);
    cont.recebidos[tipo] += qtd;
    const capi = capiDe(user);
    if (EH_GERAL.has(tipo)) {
      if (atual && atual.tipo === tipo && EF[tipo].estende(atual, t)) { somarCombo(atual, qtd, t, user); return; }
      const ult = fila[fila.length - 1];
      if (ult && ult.tipo === tipo) { somarCombo(ult, qtd, t, user); return; }
      fila.push(novoItem(tipo, user, capi, qtd, tipo));
      // passou do limite: junta os iguais (3 freadas viram uma freada ×3, na posição da primeira)
      while (fila.length > CC.filaMax) {
        let feito = false;
        for (let i = 0; i < fila.length && !feito; i++) for (let j = i + 1; j < fila.length; j++) if (fila[j].tipo === fila[i].tipo) {
          fila[i].combo += fila[j].combo; fila[i].user = fila[j].user; fila[i].capi = fila[j].capi; for (const n of fila[j].nomes) if (!fila[i].nomes.includes(n)) fila[i].nomes.push(n); fila.splice(j, 1); cont.juntados++; feito = true; break;
        }
        if (!feito) break;
      }
    } else {
      const P = pessoais[tipo];
      const chave = tipo === 'gigante' || tipo === 'vip' ? tipo + ':' + user.id : tipo;
      if (P.atual && P.atual.chave === chave && EF[tipo].estende(P.atual, t)) { somarCombo(P.atual, qtd, t, user); return; }
      const igual = P.fila.find((x) => x.chave === chave);
      if (igual) { somarCombo(igual, qtd, t, user); return; }
      P.fila.push(novoItem(tipo, user, capi, qtd, chave));
      while (P.fila.length > CC.pessoalFilaMax) {   // junta os dois últimos (fica a pessoa mais nova, com o combo somado)
        const b = P.fila.pop(), a = P.fila[P.fila.length - 1];
        a.combo += b.combo; a.user = b.user; a.capi = b.capi; a.chave = b.chave; for (const n of b.nomes) if (!a.nomes.includes(n)) a.nomes.push(n); cont.juntados++;
      }
    }
    log('caos: @' + user.nome + ' → ' + tipo + (qtd > 1 ? ' ×' + qtd : ''));
  }

  // ---------- por quadro ----------
  function iniciar(it, t) { it.ativo = true; it.inicio = t; EF[it.tipo].iniciar(it, t); }
  function terminar(it, t) { EF[it.tipo].fim(it, t); cont.executados[it.tipo] += it.combo; it.ativo = false; log('caos: fim de ' + it.tipo + (it.combo > 1 ? ' ×' + it.combo : '')); }
  function podeComecar(tipo) {
    if (tipo === 'janela') return !(atual && (atual.tipo === 'pneu' || atual.tipo === 'fiscal'));   // espera todo mundo voltar para dentro
    return true;
  }
  function atualizar(dt, t) {
    // zera o que é escrito a cada quadro
    fx.freada = 0; fx.pagode = 0; fx.tampa = 0; fx.empurrar = 0; fx.gigantes.length = 0; fx.vip = null;
    const ex = busao.extra; ex.rotX = 0; ex.rotZ = 0; ex.y = 0; ex.pneu = 0;
    estado.velRuaAlvo = 1;
    // geral (um por vez)
    if (atual && EF[atual.tipo].passo(atual, t, dt)) { terminar(atual, t); atual = null; proxGeral = t + CC.respiroSeg; }
    if (!atual && fila.length && t >= proxGeral) { atual = fila.shift(); iniciar(atual, t); }
    // pessoais (cada tipo, um por vez)
    for (const tipo of PESSOAIS) {
      const P = pessoais[tipo];
      if (P.atual && EF[tipo].passo(P.atual, t, dt)) { terminar(P.atual, t); P.atual = null; }
      if (!P.atual && P.fila.length && podeComecar(tipo)) { P.atual = P.fila.shift(); iniciar(P.atual, t); }
    }
    atualizarHolofote(t);
  }

  // ---------- painel ----------
  function rotulo(it, t) {
    if (!it) return '';
    const f = EF[it.tipo].falta ? EF[it.tipo].falta(it, t) : (it.fim != null ? Math.max(0, it.fim - t).toFixed(1) + ' s' : '');
    return NOMES[it.tipo] + (it.combo > 1 ? ' ×' + it.combo : '') + (f ? ' (' + f + ')' : '');
  }
  function descricaoAgora(t) {
    const p = PESSOAIS.map((k) => pessoais[k].atual).filter(Boolean).map((it) => rotulo(it, t));
    return (atual ? rotulo(atual, t) : 'nenhum geral') + (p.length ? ' + ' + p.join(', ') : '');
  }
  function descricaoFila() {
    const g = fila.map((it) => NOMES[it.tipo] + (it.combo > 1 ? '×' + it.combo : ''));
    const p = []; for (const k of PESSOAIS) for (const it of pessoais[k].fila) p.push(NOMES[it.tipo] + (it.combo > 1 ? '×' + it.combo : ''));
    return (g.length ? g.join(', ') : 'vazia') + (p.length ? '  · esperando: ' + p.join(', ') : '');
  }
  function descricaoContagem() { return TODOS.map((k) => k + ' ' + cont.recebidos[k]).join(' · '); }
  function pendentes() { let n = 0; for (const it of fila) n += it.combo; if (atual) n += atual.combo; for (const k of PESSOAIS) { const P = pessoais[k]; if (P.atual) n += P.atual.combo; for (const it of P.fila) n += it.combo; } return n; }
  function zerar() {   // "zerar tudo": encerra o que está acontecendo (todo mundo termina numa vaga válida)
    const t = estado.tempo;
    if (atual) { terminar(atual, t); atual = null; }
    fila.length = 0;
    for (const k of PESSOAIS) { const P = pessoais[k]; if (P.atual) { terminar(P.atual, t); P.atual = null; } P.fila.length = 0; }
  }

  return { receber, atualizar, cont, TODOS, GERAIS, PESSOAIS, NOMES, EF, vipsAtivos, descricaoAgora, descricaoFila, descricaoContagem, pendentes, zerar,
    get atual() { return atual; }, get fila() { return fila; }, pessoais,
    // Fase 5.1
    sortearPonderado, peso, derrubarN, forcarAlvo(c) { alvoForcado = c; }, get alvoForcado() { return alvoForcado; },
    // Fase 5.2
    candidatos, sortearVitimas, segura };
})();

/* =====================================================================
   EVENTOS (barramento interno — a LIVE chama estes mesmos, como o simulador)
   user = { id, nome, foto }
   Fase 5: extra = { msgId, giftId } (opcional). Id de mensagem repetido é descartado aqui também (2ª barreira).
   ===================================================================== */
const eventos = (() => {
  const ouvintes = {};
  const on = (tipo, fn) => { (ouvintes[tipo] ||= []).push(fn); };
  const emitir = (tipo, ...a) => { for (const fn of ouvintes[tipo] || []) { try { fn(...a); } catch (e) { console.error(e); log('erro em ' + tipo + ': ' + e.message); } } };
  const ok = (u) => !!u && typeof u === 'object' && (u.id != null || u.nome != null);
  const norm = (u) => ({ id: String(u.id ?? u.nome), nome: String(u.nome ?? u.id ?? 'capivara').slice(0, 40), foto: typeof u.foto === 'string' && u.foto ? u.foto : null });
  const cont = { comentarios: 0, presentes: 0, presentesMsgs: 0, repetidos: 0 };
  const MAX = 2000, vistos = new Set(), anel = []; let pos = 0;
  function repetido(extra) {
    const id = extra && extra.msgId; if (id == null || id === '') return false;
    const k = String(id); if (vistos.has(k)) { cont.repetidos++; return true; }
    if (anel.length < MAX) anel.push(k); else { vistos.delete(anel[pos]); anel[pos] = k; pos = (pos + 1) % MAX; }
    vistos.add(k); return false;
  }
  return {
    on, cont,
    // dado inválido da LIVE (sem usuário) é ignorado, nunca quebra o jogo
    entrar(user) { if (ok(user)) emitir('entrar', norm(user)); },
    sair(user) { if (ok(user)) emitir('sair', norm(user)); },
    presente(user, nome, qtd = 1, extra = null) {
      if (!ok(user) || repetido(extra)) return;
      const q = Math.max(1, qtd | 0); cont.presentes += q; cont.presentesMsgs++;
      emitir('presente', norm(user), String(nome || ''), q, extra || {});
    },
    comentario(user, texto, extra = null) { if (!ok(user) || repetido(extra)) return; cont.comentarios++; emitir('comentario', norm(user), String(texto || '')); },
  };
})();

eventos.on('entrar', (u) => { placar.pessoa(u); const r = capivaras.subirNaHora(u); if (r !== 'ja-dentro') log('entrar: @' + u.nome + ' (' + r + ')'); });
eventos.on('sair', (u) => { if (capivaras.sair(u)) log('sair: @' + u.nome); });
eventos.on('comentario', (u, txt) => {
  placar.pessoa(u);
  let c = capivaras.porId.get(u.id);
  if (c) capivaras.atualizarUser(c, u); else c = capivaras.chegarNoPonto(u);   // Fase 5.1: vai para a fila do PRÓXIMO PONTO
  if (!c) { log('comentário: @' + u.nome + ' (fila do ponto cheia: só no placar)'); return; }
  capivaras.comentou(c);   // acorda (zera o cochilo); quem já está a bordo só ganha o balão
  const texto = filtrarComentario(txt);
  // Fase 5.3: quem comentou NÃO ganha plaquinha de nome separada: o nome vai dentro do balão (foto + nome + texto numa peça só)
  if (texto) rotulos.balao(c, texto);
  log('comentário: @' + u.nome + ' — "' + (texto || '(filtrado)') + '"');
});
eventos.on('presente', (u, nome, qtd, extra) => {
  const efeito = efeitoDoPresente(nome, extra && extra.giftId);   // Fase 5: o id vale antes do nome
  log('presente: @' + u.nome + ' mandou ' + qtd + '× ' + nome + (efeito ? ' → ' + efeito : ''));
  placar.pessoa(u);
  // tronos: o presente certo toma o volante / a catraca (não passa pela fila comum)
  if (efeito === 'motorista' || efeito === 'cobrador') { tronos.pedir(efeito, u); return; }
  const antes = capivaras.porId.get(u.id);
  const jaDentro = capivaras.aBordo(antes);
  // Fase 5.1: ESCUDO "Segura firme!" (acumula até CONFIG.placar.maxEscudos) e quem não está a bordo sobe na hora
  if (efeito === 'escudo') placar.darEscudo(u, qtd);
  const ehCaos = !!(efeito && caos.EF[efeito]);
  const sobe = efeito === 'entrar' || efeito === 'escudo' || (!efeito && CONFIG.presenteQualquerEmbarca) || (ehCaos && CONFIG.caosTambemEmbarca);
  if (sobe && !jaDentro) capivaras.subirNaHora(u);   // não espera o ponto (com o busão lotado, empurra alguém em pé)
  const c = capivaras.porId.get(u.id);
  if (c) {
    capivaras.tocar(c);   // presente = interação: acorda do cochilo
    if (jaDentro) { capivaras.animar.pular(c); rotulos.brilhar(c); som.brilho(); }   // já está no busão: pulinho + brilho (o "entrar" de hoje)
    else rotulos.destacar(c);
    if (efeito === 'escudo') capivaras.redesenhar(c);
  }
  // Fase 4: efeitos de caos (quem manda fica onde está: sabota de fora)
  if (ehCaos) caos.receber(efeito, u, qtd, extra && extra.moedas);
  // Fase 5.3: presente grande que não é caos nem trono (acima de CONFIG.tela.presenteGrandeMoedas): anúncio grande com o crédito
  else if (extra && extra.moedas > CONFIG.tela.presenteGrandeMoedas && c) anuncios.enfileirar({ tipo: 'presente', nome: u.nome, capi: c, presente: nome, moedas: extra.moedas });
});

  function fotoFalsa() {

  }
  let n = 0;
  function usuario() { n++; const nome = (escolher(NOMES) + ' ' + escolher(SOBRENOMES)).trim(); return { id: 'sim_' + n, nome: Math.random() < 0.25 ? nome.replace(/ /g, '_').toLowerCase() + (n % 100) : nome, foto: fotoFalsa() }; }
  const conhecidos = [];
  function lembrar(u) { conhecidos.push(u); if (conhecidos.length > 400) conhecidos.shift(); }

  function comentarioDeDentro() { const c = capivaras.sortearDentro(); if (!c) return false; eventos.comentario(c.user, escolher(FRASES)); return true; }
  function rosaDeDentro() { const c = capivaras.sortearDentro(); if (!c) return false; eventos.presente(c.user, 'Rosa', 1); return true; }

  const disputaInfo = { ultimo: null, mandados: [] };
  function disputa() {

  // ---------- caos (Fase 4) ----------

  function caosDe(tipo, origem = 'novo', qtd = 1) {
    let u = null;
    if (origem && typeof origem === 'object') u = origem;

  // derrubar o rei: alguém novo manda um BURACO e a queda escolhe o rei (se ele estiver a bordo)

  function derrubarTrono(nome) {
