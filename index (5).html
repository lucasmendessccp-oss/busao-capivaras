  // ponto cheio: 20 comentários de gente nova e o busão já vai para o próximo ponto (para ver a catraca cobrando)
  function pontoCheio(n = 20) { for (let i = 0; i < n; i++) { const u = usuario(); lembrar(u); eventos.comentario(u, escolher(FRASES)); } viagem.proximoAgora(); }
  function caosSequencia() { caos.TODOS.forEach((tp, i) => agendar(i * 1, () => caosDe(tp, 'novo'))); }
  function comboFreada() { for (let i = 0; i < 5; i++) agendar(i * 0.45, () => caosDe('freada', 'novo')); }
  function caosNaTroca() { caosDe('freada', 'novo'); caosDe('fiscal', 'novo'); virar('motorista', 'novo'); }

  // LIVE falsa
  let ligada = false, prox = 0, fase = 0;
  function passo(t) {
    while (agenda.length && t >= agenda[0].t) agenda.shift().fn();
    if (!ligada || t < prox) return;
    fase += 0.02; const agito = 0.5 + 0.5 * Math.sin(fase) * Math.sin(fase * 0.37); // ritmo variável
    prox = t + aleat(0.15, 1.6) * (1.2 - agito);
    if (Math.random() < 1 / 15) {   // ~1 a cada 15 eventos: presente de caos (às vezes vários iguais seguidos)
      const tp = escolher(caos.TODOS); const u = caosDe(tp, escolher(['novo', 'dentro', 'conhecido']));
      if (Math.random() < 0.3) { const extra = 1 + ((Math.random() * 3) | 0); for (let i = 1; i <= extra; i++) agendar(i * aleat(0.25, 0.5), () => caosDe(tp, Math.random() < 0.6 ? u : 'novo')); }
      return;
    }
    const r = Math.random();
    if (r < 0.05) {   // ~1 a cada 20 eventos: presente de trono (às vezes de quem já está no trono)
      const qual = Math.random() < 0.5 ? 'motorista' : 'cobrador';
      const dono = capivaras.tronos()[qual === 'motorista' ? 0 : 1];
      if (dono && Math.random() < 0.3) eventos.presente(dono.user, presenteDe(qual), 1);
      else virar(qual, escolher(['novo', 'dentro', 'fila']));
    }
    else if (r < 0.26) { if (!comentarioDeDentro()) eventos.comentario(usuario(), escolher(FRASES)); }
    else if (r < 0.54) { const u = Math.random() < 0.3 && conhecidos.length ? escolher(conhecidos) : usuario(); lembrar(u); eventos.comentario(u, escolher(FRASES)); }
    else if (r < 0.62) { rosaDeDentro(); }
    else if (r < 0.97) { const u = Math.random() < 0.4 && conhecidos.length ? escolher(conhecidos) : usuario(); lembrar(u); eventos.presente(u, Math.random() < 0.85 ? 'Rosa' : escolher(['Bala', 'Pirulito', 'Café', 'Perfume']), 1); }
    else { const c = capivaras.sortearDentro(); if (c) eventos.sair(c.user); }
  }
  return {
    mais, passo, usuario, comentarioDeDentro, rosaDeDentro, fotoFalsa, FRASES, virar, disputa, disputaInfo, presenteDe, agenda, agendar,
    caosDe, caosSequencia, comboFreada, caosNaTroca, conhecidos, encher, escudo, empurraoLotado, derrubarRei,
    derrubarTrono, pontoCheio,
    get ligada() { return ligada; },
    alternar() { ligada = !ligada; log('LIVE falsa ' + (ligada ? 'ligada' : 'desligada')); return ligada; },
  };
})();

/* =====================================================================
   VIAGEM (Fase 5.1): o ciclo  rodando (40 s) → chegando (~3 s) → parado no ponto (8 s) → partindo.
   - O ponto NÃO anda com o busão: ele fica na calçada e passa junto com a rua (PONTO_DESL.x).
   - Chegando: o busão desacelera suave (v = √(distância / D0)) e para com a porta na frente do ponto (PONTO_DESL.x = 0).
   - Parado: a porta abre, quem cochilou desce e a fila sobe pela catraca até lotar. Quem não coube espera o próximo ponto.
   - Partindo: acelera; o ponto fica para trás, sai de cena e é REAPROVEITADO como o próximo ponto (nada é criado de novo).
   - Pneu furado: a rua para e o tempo até o próximo ponto pausa.
   ===================================================================== */
const viagem = (() => {
  const V = CONFIG.viagem;
  const st = { estado: 'rodando', restante: V.rodandoSeg, tEstado: 0, ciclos: 0, paradas: 0, cochilaram: 0, porta: false, historico: [] };
  const VR = () => CONFIG.velocidadeRua;
  const D0 = () => VR() * V.chegandoSeg / 2;   // com v = √(d/D0), o busão anda D0 e para em chegandoSeg
  const ponto3d = cenaModulo.ponto;
  function mudar(e) { st.historico.push([e, +estado.tempo.toFixed(2)]); if (st.historico.length > 60) st.historico.shift(); st.estado = e; st.tEstado = 0; log('viagem: ' + e); }
  function chegar() {
    mudar('chegando'); PONTO_DESL.x = D0(); ponto3d.visible = true;
    anunciar('PRÓXIMO PONTO!', 2200, 'ponto', true); som.pontoDing();
  }
  function parar() {
    mudar('parado'); PONTO_DESL.x = 0; estado.velRua = 0; st.paradas++; st.porta = true;
    st.cochilaram += capivaras.descerCochilados();
  }
  function partir() { mudar('partindo'); st.porta = false; st.restante = V.rodandoSeg; st.ciclos++; cobranca.novoPonto(); }   // Fase 5.2: limite da catraca zera ao sair do ponto
  function atualizar(dt, t) {
    st.tEstado += dt;
    const livre = estado.velRua + (estado.velRuaAlvo - estado.velRua) * Math.min(1, dt * 1.8);   // o que o caos deixa (freada, pneu)
    if (st.estado === 'rodando' || st.estado === 'partindo') {
      estado.velRua = st.estado === 'partindo' ? estado.velRua + (estado.velRuaAlvo - estado.velRua) * Math.min(1, dt * 0.9) : livre;   // partida: acelera devagar
      if (!capivaras.pausas.has('pneu')) st.restante -= dt;   // pneu furado: o tempo até o próximo ponto pausa
      if (st.estado === 'partindo') {
        PONTO_DESL.x -= VR() * estado.velRua * dt;
        if (PONTO_DESL.x < -V.sumirAlem) { mudar('rodando'); ponto3d.visible = false; capivaras.esconderFila(); }
      } else if (st.restante <= 0) chegar();
    } else if (st.estado === 'chegando') {
      const perfil = Math.sqrt(Math.max(0, PONTO_DESL.x) / D0());
      estado.velRua = Math.min(livre, perfil);
      PONTO_DESL.x -= VR() * estado.velRua * dt;
      if (PONTO_DESL.x <= 0.01) parar();
    } else if (st.estado === 'parado') {
      estado.velRua = 0;
      st.porta = st.tEstado < V.paradoSeg - 0.6;   // a porta fecha um pouquinho antes de sair
      if (st.tEstado >= V.paradoSeg && !capivaras.pausas.has('pneu')) partir();
    }
    ponto3d.position.x = PONTO.abrigo.x + PONTO_DESL.x;
  }
  // Fase 5.3: o card "Próximo ponto: N esperando" e o "+N esperando" saíram da tela: o número está no letreiro ("3 na fila")
  const pontoNaTela = () => st.estado === 'chegando' || st.estado === 'parado' || st.estado === 'partindo';
  function proximoAgora() { if (st.estado === 'rodando' || st.estado === 'partindo') { st.restante = 0; return true; } return false; }
  const NOME = { rodando: 'rodando', chegando: 'chegando no ponto', parado: 'parado no ponto', partindo: 'saindo do ponto' };
  function descricao() {
    const e = st.estado;
    return `Viagem: ${NOME[e]}` + (e === 'rodando' || e === 'partindo' ? ` · próximo ponto em ${Math.max(0, st.restante).toFixed(0)} s${capivaras.pausas.has('pneu') ? ' (pausado: pneu)' : ''}` :
      e === 'parado' ? ` · sai em ${Math.max(0, V.paradoSeg - st.tEstado).toFixed(1)} s` : '') +
      `\nFila do ponto: ${capivaras.totalPonto()} (limite ${V.limiteFila}) · paradas ${st.paradas} · desceram cochilando ${st.cochilaram}`;
  }
  return { atualizar, proximoAgora, descricao, st, D0,
    get estado() { return st.estado; }, get parado() { return st.estado === 'parado'; }, get embarqueAberto() { return st.estado === 'parado' && st.porta; },
    get pontoNaTela() { return pontoNaTela(); }, get restante() { return st.restante; } };
})();

/* =====================================================================
   PLACAR (Fase 5.1): "Rei do Busão". Sem fim de rodada: vale a LIVE inteira.
   - Tempo acumulado A BORDO (dentro ou no teto). Cair não zera. Tempo no trono (motorista/cobrador) não conta.
   - O 1º é o REI: coroa, Banco do Rei, nome no letreiro e volta triunfal.
   - Escudos ("Segura firme!") ficam guardados por pessoa (até CONFIG.placar.maxEscudos).
   - Salvo no navegador a cada ~10 s (com o @ da LIVE e a data): recarregou a página, o placar volta.
   ===================================================================== */
const placar = (() => {
  const P = CONFIG.placar;
  const pessoas = new Map();   // id -> { id, nome, tempo, escudos, marco }
  let top = [], reiId = null, reiABordo = false, reiAnunciado = null, ultimoAnuncioRei = -99;
  let proxSeg = 0, proxBanco = 0, proxSalvar = P.salvarSeg, usuario = String(params.get('usuario') || ler('live.usuario', CONFIG.live.usuarioPadrao) || '').replace(/^@/, '').toLowerCase();
  const cont = { escudosDados: 0, escudosUsados: 0, reiDerrubado: 0, trocasRei: 0, marcos: 0, salvos: 0, restaurado: 0, podados: 0, voltasRei: 0 };
  const COROA_SVG = '<svg viewBox="0 0 24 24"><path d="M3 18 L4.5 7 L9 11.5 L12 5 L15 11.5 L19.5 7 L21 18 Z" fill="#3e2700"/><rect x="3" y="18.5" width="18" height="2.6" rx="1" fill="#3e2700"/></svg>';
  const elP = $('#placar');   // Fase 5.3: o letreiro não repete mais o Rei (ele já é o 1º do ranking)
  elP.innerHTML = '<div class="tit">TEMPO NO BUSÃO</div>' + [1, 2, 3].map((n) => `<div class="lin" hidden><span class="pos">${n === 1 ? COROA_SVG : n}</span><span class="nm"></span><span class="tm"></span></div>`).join('');
  const linhas = [...elP.querySelectorAll('.lin')].map((el) => ({ el, nm: el.querySelector('.nm'), tm: el.querySelector('.tm'), txt: '', fora: null }));
  const ret = { x0: 0, y0: 0, x1: 0, y1: 0 }; let vis = false;

  function fmt(seg) {
    seg = Math.max(0, Math.floor(seg)); const h = Math.floor(seg / 3600), m = Math.floor(seg / 60) % 60, s = seg % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : String(m).padStart(2, '0')) + ':' + String(s).padStart(2, '0');
  }
  function pessoa(user) {
    let p = pessoas.get(user.id);
    if (!p) { p = { id: user.id, nome: user.nome || String(user.id), tempo: 0, escudos: 0, marco: 0 }; pessoas.set(user.id, p); if (pessoas.size > P.maxPessoas) podar(); }
    else if (user.nome) p.nome = user.nome;
    return p;
  }
  // limite de memória: passou de maxPessoas, esquece quem tem menos tempo (e não está no busão)
  function podar() {
    const fixos = new Set(); for (const v of capivaras.todasVagas) if (v.ocupante) fixos.add(v.ocupante.user.id);
    const l = [...pessoas.values()].filter((p) => !fixos.has(p.id)).sort((a, b) => (a.tempo - b.tempo) || (a.escudos - b.escudos));
    const alvo = Math.floor(P.maxPessoas * 0.9); let i = 0;
    while (pessoas.size > alvo && i < l.length) { pessoas.delete(l[i++].id); cont.podados++; }
    recalcularTop(true);
  }
  const escudos = (id) => { const p = pessoas.get(id); return p ? p.escudos : 0; };
  function darEscudo(user, qtd = 1) {
    const p = pessoa(user); const antes = p.escudos;
    p.escudos = Math.min(P.maxEscudos, p.escudos + Math.max(1, qtd | 0)); cont.escudosDados += p.escudos - antes;
    som.brilho(); log('escudo: @' + p.nome + ' tem ' + p.escudos);
    return p.escudos;
  }
  // a capivara seria derrubada / empurrada: o escudo estoura no lugar dela
  function usarEscudo(c, motivo, autor) {
    if (c.vaga && c.vaga.trono && c.vaga.ocupante === c) return false;   // Fase 5.2: no trono o escudo fica guardado (não gasta, não segura)
    const p = pessoas.get(c.user.id); if (!p || p.escudos <= 0) return false;
    p.escudos--; cont.escudosUsados++;
    som.escudo(); capivaras.animar.pular(c); rotulos.efeito(c, 'segurou', 'SEGUROU!'); capivaras.redesenhar(c);   // Fase 5.3: balãozinho pequeno colado
    log('escudo: @' + p.nome + ' segurou (' + motivo + (autor ? ' de @' + autor.nome : '') + '), sobram ' + p.escudos);
    return true;
  }
  // caiu (caos ou empurrão): balão "CAIU!" e, se for o rei, "@C DERRUBOU O REI!"
  // Fase 5.2: info = { trono, perigo }. Perigo do caminho não tem autor: "O GALHO DERRUBOU O REI!"
  function aoDerrubar(c, jeito, autor, info = {}) {
    rotulos.queda(c); som.queda();   // Fase 5.3: "CAIU!" pequeno, parado no ponto da queda (3 no máximo; mais que isso vira "CAIU! ×N")
    if (c.user.id === reiId && ((autor && autor.id !== reiId) || (!autor && info.perigo))) {
      const quem = autor ? '@' + autor.nome : 'O ' + info.perigo;
      cont.reiDerrubado++; anunciar(quem + ' DERRUBOU O REI!', 3200, 'queda', true); cameraDiretora.pedir({ tipo: 'tremida' });
      log(quem + ' derrubou o rei @' + c.user.nome + ' (' + jeito + ')');
    }
    if (info.trono) tronos.derrubado(info.trono, c, autor, info.perigo);   // Fase 5.2: o trono passa adiante
  }
  function aoCochilar(c) { rotulos.efeito(c, 'sono', 'Zzz… perdi o ponto!'); }   // Fase 5.3: balãozinho pequeno
  const vagaConta = (v) => { const c = v.ocupante; return !!c && !c.empresa && c.vaga === v && (c.estado === 'dentro' || c.estado === 'entrando' || c.estado === 'fora') ? c : null; };
  function aBordo(id) { const c = capivaras.porId.get(id); return !!c && capivaras.aBordo(c); }

  function recalcularTop(todos) {
    let l;
    if (todos) l = [...pessoas.values()];
    else {
      l = []; for (const id of top) { const p = pessoas.get(id); if (p) l.push(p); }
      for (const v of capivaras.todasVagas) { const c = vagaConta(v); if (c) { const p = pessoas.get(c.user.id); if (p && !l.includes(p)) l.push(p); } }
    }
    l = l.filter((p) => p.tempo > 0).sort((a, b) => b.tempo - a.tempo).slice(0, 3);
    top = l.map((p) => p.id);
    if (todos) reiId = top[0] || null;
  }
  // o 1º mudou (ou o rei ficou com tempo suficiente para ser anunciado)
  function anunciarRei(t) {
    const p = reiId ? pessoas.get(reiId) : null;
    if (!p || p.tempo < P.anuncioReiMinSeg || reiAnunciado === p.id || t - ultimoAnuncioRei < P.anuncioReiIntervaloSeg) return;
    const ant = reiAnunciado ? pessoas.get(reiAnunciado) : null;
    anunciar(ant ? '@' + p.nome + ' passou @' + ant.nome + ' e é o novo REI DO BUSÃO!' : '@' + p.nome + ' é o REI DO BUSÃO!', 3400, 'rei', true);
    som.fanfarra(); reiAnunciado = p.id; ultimoAnuncioRei = t;
    log('rei: @' + p.nome + (ant ? ' passou @' + ant.nome : ''));
  }
  function atualizar(dt, t) {
    const fator = estado.acelerado ? 1 : 60;
    let lider = reiId ? pessoas.get(reiId) : null;
    // relógio: só corre para quem está A BORDO (dentro, no teto ou no trono)
    // Fase 5.2: trono conta metade no minuto imune e inteiro depois (CONFIG.tronos); teto conta CONFIG.teto.placar (1×)
    for (const v of capivaras.todasVagas) {
      const c = vagaConta(v); if (!c) continue;
      const ganho = v.trono ? tronos.valorPlacar(v.trono, dt) : v.local === 'teto' ? dt * CONFIG.teto.placar : dt;
      if (!(ganho > 0)) continue;
      const p = pessoa(c.user); p.tempo += ganho;
      while (p.marco < P.marcosMin.length && p.tempo >= P.marcosMin[p.marco] * fator) {
        anunciar('@' + p.nome + ': ' + P.marcosMin[p.marco] + ' minutos de busão!', 2600, 'rei'); cont.marcos++; p.marco++;
      }
      if (p !== lider && (!lider || p.tempo > lider.tempo)) {
        lider = p; reiId = p.id; cont.trocasRei++;
        if (!top.includes(p.id)) top.unshift(p.id);
        reiABordo = true;
      }
    }
    anunciarRei(t);
    // rei a bordo: coroa (também no trono) e volta triunfal
    const rc = reiId ? capivaras.porId.get(reiId) : null;
    const abordo = !!rc && capivaras.aBordo(rc);
    capivaras.reiCapi = abordo ? rc : null;
    if (abordo && !reiABordo && reiId === reiAnunciado) {
      cont.voltasRei++; anunciar('O REI VOLTOU!', 2600, 'rei', true); som.fanfarra(); rotulos.brilhar(rc);
      log('o rei @' + rc.user.nome + ' voltou');
    }
    reiABordo = abordo;
    if (t >= proxBanco) { proxBanco = t + 0.5; capivaras.ajustarBancoRei(abordo && !rc.vaga.trono ? rc : null); }
    if (t >= proxSeg) { proxSeg = t + 1; recalcularTop(false); desenhar(); }
    if (t >= proxSalvar) { proxSalvar = t + P.salvarSeg; salvarAgora(); }
  }
  // placar na tela (1× por segundo) e o nome do rei no letreiro
  function desenhar() {
    const ver = top.length > 0 && !estado.telaInicio;
    if (ver !== vis) { elP.classList.toggle('ver', ver); vis = ver; }
    for (let i = 0; i < 3; i++) {
      const L = linhas[i], p = pessoas.get(top[i]);
      if (!p) { if (!L.el.hidden) L.el.hidden = true; continue; }
      if (L.el.hidden) L.el.hidden = false;
      const nm = p.nome, tm = fmt(p.tempo);
      if (L.nm.textContent !== nm) L.nm.textContent = nm;
      if (L.tm.textContent !== tm) L.tm.textContent = tm;
      const fora = !aBordo(p.id); if (fora !== L.fora) { L.el.classList.toggle('fora', fora); L.fora = fora; }
    }
    if (vis) retNoPalco(elP, ret);
  }
  // ---------- guardar no navegador (a página pode recarregar no meio da LIVE) ----------
  function salvarAgora() {
    const l = []; for (const p of pessoas.values()) if (p.tempo > 0 || p.escudos > 0) l.push([p.id, p.nome, Math.round(p.tempo * 10) / 10, p.escudos, p.marco]);
    salvar('placar', { usuario, data: Date.now(), dia: new Date().toLocaleDateString('pt-BR'), rei: reiAnunciado, pessoas: l });
    cont.salvos++;
  }
  function restaurar() {
    const s = ler('placar', null);
    if (!s || !Array.isArray(s.pessoas) || String(s.usuario || '') !== usuario || Date.now() - (s.data || 0) > P.validadeHoras * 3600e3) return false;
    for (const [id, nome, tempo, esc, marco] of s.pessoas) pessoas.set(String(id), { id: String(id), nome: String(nome), tempo: +tempo || 0, escudos: Math.min(P.maxEscudos, esc | 0), marco: marco | 0 });
    recalcularTop(true); reiAnunciado = s.rei && pessoas.has(s.rei) ? s.rei : reiId; reiABordo = false;
    cont.restaurado = pessoas.size; desenhar();
    log('placar restaurado: ' + pessoas.size + ' pessoas (@' + usuario + ')');
    return true;
  }
  // trocou o @ da LIVE na tela de começo: se o placar guardado é de outro @, começa do zero
  function trocarUsuario(u) {
    u = String(u || '').replace(/^@/, '').toLowerCase(); if (u === usuario) return;
    usuario = u; pessoas.clear(); top = []; reiId = reiAnunciado = null; restaurar(); desenhar();
  }
  function zerar() {
    pessoas.clear(); top = []; reiId = null; reiAnunciado = null; reiABordo = false; capivaras.reiCapi = null;
    salvarAgora(); desenhar(); log('placar zerado');
    for (const c of capivaras.visiveis) capivaras.redesenhar(c);
  }
  function texto(n = P.copiarTop) {
    const l = [...pessoas.values()].filter((p) => p.tempo > 0).sort((a, b) => b.tempo - a.tempo).slice(0, n);
    const h = new Date();
    return `Placar do Busão · @${usuario} · ${h.toLocaleDateString('pt-BR')} ${h.toLocaleTimeString('pt-BR').slice(0, 5)}\n` +
      (l.length ? l.map((p, i) => `${i + 1}. @${p.nome} — ${fmt(p.tempo)}${i === 0 ? ' (REI DO BUSÃO)' : ''}`).join('\n') : '(ninguém ainda)');
  }
  function topN(n = 10) { return [...pessoas.values()].filter((p) => p.tempo > 0).sort((a, b) => b.tempo - a.tempo).slice(0, n); }
  function escudosAtivos() { let n = 0, pes = 0; for (const p of pessoas.values()) if (p.escudos > 0) { n += p.escudos; pes++; } return { escudos: n, pessoas: pes }; }

  // ligações com as capivaras (os enfeites da fotinho, o escudo, a queda e o cochilo)
  // Fase 5.2: no trono o escudo fica guardado: o aro azul some e volta quando a pessoa sai do trono
  capivaras.ganchos.enfeites = (c) => ({ escudos: c.vaga && c.vaga.trono && c.vaga.ocupante === c ? 0 : escudos(c.user.id), zzz: !!c.zzz });
  capivaras.ganchos.usarEscudo = usarEscudo;
  capivaras.ganchos.aoDerrubar = aoDerrubar;
  capivaras.ganchos.aoCochilar = aoCochilar;
  capivaras.ganchos.ehRei = (id) => id === reiId;
  restaurar();
  return { atualizar, pessoa, darEscudo, usarEscudo, escudos, zerar, texto, topN, escudosAtivos, salvarAgora, restaurar, trocarUsuario, fmt, cont, pessoas,
    retangulo: () => (vis ? ret : null), reiCapi: () => (reiId ? capivaras.porId.get(reiId) || null : null), ehRei: (id) => id === reiId,
    get reiId() { return reiId; }, get top() { return top; }, get usuario() { return usuario; } };
})();

/* =====================================================================
   COBRANÇA (Fase 5.2): o COBRADOR cobra passagem na catraca.
   - Só com cobrador DE VERDADE (pessoa da LIVE). Com o funcionário da empresa, ninguém paga.
   - Quem entra pela porta e passa pela catraca paga CONFIG.cobrador.passagemSeg (1 s): o cobrador ganha +1 s,
     quem passou perde 1 s (nunca fica negativo; com 0 s não perde nada, mas o cobrador ganha mesmo assim).
   - Teto, Banco do Rei, motorista e o próprio cobrador não passam pela catraca.
   - Limite: CONFIG.cobrador.maxPorPonto por ponto (o resto entra de graça). A conta zera quando o busão SAI do ponto,
     então quem sobe com o busão andando soma no limite do PRÓXIMO ponto.
   ===================================================================== */
const cobranca = (() => {
  const CB = CONFIG.cobrador;
  const cont = { cobradas: 0, roubados: 0, ganhos: 0, deGraca: 0, noPonto: 0, pontos: 0 };
  function cobrar(c) {
    const cob = tronos.cobrador();
    if (!cob || cob === c || tronos.por.motorista.dono === c) return false;
    if (cont.noPonto >= CB.maxPorPonto) { cont.deGraca++; return false; }
    cont.noPonto++; cont.cobradas++;
    const p = placar.pessoa(c.user), q = placar.pessoa(cob.user);
    const perde = Math.min(CB.passagemSeg, Math.max(0, p.tempo));
    p.tempo -= perde; q.tempo += CB.passagemSeg;
    cont.roubados += perde; cont.ganhos += CB.passagemSeg;
    c.perdeuPassagem = perde; c.cobradoPor = cob;
    return true;
  }
  // passou na catraca (a cobrança já foi feita no embarque): "−1s" de quem pagou, "+1s" do cobrador e o plim
  function passou(c) {
    const cob = c.cobradoPor; c.cobradoPor = null;
    // Fase 5.3: o "−1s" voando em cima de cada passageiro acabou (o desconto continua, só não é desenhado);
    // o "+1s" dourado do cobrador pisca ao lado do nome dele na faixa dos tronos, somando tudo do ponto ("+5s")
    if (cob && tronos.cobrador() === cob) faixaTronos.cobrou(CB.passagemSeg);
    som.plim();
  }
  function novoPonto() { cont.noPonto = 0; cont.pontos++; }
  function descricao() {
    return `Passagens cobradas: ${cont.cobradas} · segundos roubados: ${cont.roubados.toFixed(0)} · de graça (passou do limite): ${cont.deGraca}` +
      ` · neste ponto: ${cont.noPonto}/${CB.maxPorPonto}`;
  }
  capivaras.ganchos.cobrar = cobrar;
  capivaras.ganchos.passouCatraca = passou;
  return { cobrar, passou, novoPonto, descricao, cont };
})();

/* =====================================================================
   PERIGOS DO CAMINHO (Fase 5.2): galho baixo ou viaduto passando rente ao teto.
   - Só com o busão RODANDO (nem parado, nem chegando, nem com o pneu furado) e só com gente no teto.
   - O relógio (60 a 120 s, sorteado) só anda nessas condições. "ABAIXA!" 1,5 s antes; derruba 1 ou 2 do teto.
   - O escudo segura. Não conta como interação. Sem autor ("O GALHO DERRUBOU O REI!").
   - Desenho: UM objeto 3D só (uma malha; a geometria troca entre galho e viaduto), visível só durante o perigo.
   ===================================================================== */
const perigos = (() => {
  const PG = CONFIG.perigos;
  const cont = { aparecidos: 0, derrubados: 0, seguraram: 0, cancelados: 0, galhos: 0, viadutos: 0, log: [] };
  // ---------- o objeto (criado uma vez) ----------
  const MARROM = 0x6d4c41, MARROM2 = 0x8d6e63, FOLHA = 0x7cb342, FOLHA2 = 0x43a047, CONC = 0xb0bec5, CONC2 = 0x78909c, AMAR = 0xffc107, PRETO = 0x263238;
  const ico = (r, x, y, z, cor, sy = 1) => pintar(new THREE.IcosahedronGeometry(r, 0).toNonIndexed().scale(1, sy, 1).translate(x, y, z), cor);
  const Y0 = B.teto + 0.95;   // altura de baixo do obstáculo: passa rente às cabeças de quem está no teto
  const geoGalho = mesclar([
    caixaColorida(-0.3, 0.3, 0, 6.2, -4.9, -4.3, MARROM),                                  // tronco (calçada do fundo)
    caixaColorida(-0.18, 0.18, Y0 + 0.55, Y0 + 0.9, -4.4, -2.0, MARROM2),                  // galho, descendo em degraus até passar do teto
    caixaColorida(-0.16, 0.16, Y0 + 0.3, Y0 + 0.62, -2.1, 0.1, MARROM2),
    caixaColorida(-0.14, 0.14, Y0 + 0.08, Y0 + 0.38, 0.0, 1.9, MARROM2),
    caixaColorida(-0.07, 0.07, Y0 + 0.1, Y0 + 0.55, 0.9, 1.0, MARROM2),
    ico(1.9, 0, 7.0, -4.6, FOLHA2, 0.8), ico(1.2, 0.6, 6.2, -3.4, FOLHA),                     // copa
    ico(0.8, 0.1, Y0 + 0.8, -1.4, FOLHA), ico(0.7, -0.2, Y0 + 0.55, 0.0, FOLHA2), ico(0.75, 0.2, Y0 + 0.4, 1.2, FOLHA),
    ico(0.55, -0.3, Y0 + 0.15, 1.9, FOLHA2), ico(0.45, 0.35, Y0 + 0.75, 0.6, FOLHA),
  ]);
  const geoViaduto = mesclar([
    // termina logo depois do meio-fio (sem pilar na frente: nada tapa o busão)
    caixaColorida(-1.4, 1.4, Y0 + 0.2, Y0 + 0.85, -6.5, 3.0, CONC),                          // tabuleiro
    caixaColorida(-1.42, 1.42, Y0 + 0.85, Y0 + 1.15, -6.5, 3.0, CONC2),                       // mureta
    caixaColorida(-1.42, 1.42, Y0 + 0.02, Y0 + 0.2, 1.6, 3.02, AMAR),                         // faixa de aviso (amarela e preta)
    ...[-1.1, -0.45, 0.2, 0.85].map((x) => caixaColorida(x, x + 0.32, Y0 + 0.02, Y0 + 0.2, 3.0, 3.04, PRETO)),
    caixaColorida(-0.4, 0.4, 0, Y0 + 0.2, -5.8, -5.0, CONC2),                                 // pilar (calçada do fundo)
  ]);
  const malha = new THREE.Mesh(geoGalho, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }));
  malha.visible = false; malha.castShadow = false; malha.matrixAutoUpdate = true;
  cena.add(malha);
  // ---------- estado ----------
  const sortear = () => aleat(PG.minSeg, Math.max(PG.minSeg, PG.maxSeg));
  const st = { fase: 'esperando', relogio: sortear(), tipo: 'GALHO', x: 0, t0: 0, vitimas: null, escolheu: false };
  const podeRodar = () => viagem.estado === 'rodando' && !capivaras.pausas.has('pneu');
  const genteNoTeto = () => capivaras.ocupantes('teto', estado.tempo);
  function comecar(t, forcado, tipo) {
    st.fase = 'passando'; st.t0 = t; st.escolheu = false; st.vitimas = null;
    st.tipo = tipo || (Math.random() < 0.5 ? 'GALHO' : 'VIADUTO');
    malha.geometry = st.tipo === 'GALHO' ? geoGalho : geoViaduto;
    st.x = B.comp + 0.3 + CONFIG.velocidadeRua * Math.max(0.3, estado.velRua) * PG.avisoSeg;   // chega na frente do busão em ~1,5 s
    malha.position.set(st.x, 0, 0); malha.visible = true;
    cont.aparecidos++; st.tipo === 'GALHO' ? cont.galhos++ : cont.viadutos++;
    anuncios.urgente({ tipo: 'texto', texto: 'ABAIXA!', ms: 1500, estilo: 'perigo', fixo: true });
    som.alerta();
    cont.log.push([+t.toFixed(1), st.tipo, viagem.estado, genteNoTeto().length]); if (cont.log.length > 200) cont.log.shift();
    log('perigo: ' + st.tipo.toLowerCase() + (forcado ? ' (agora)' : '') + ' — ABAIXA!');
  }
  function terminar() { st.fase = 'esperando'; st.relogio = sortear(); malha.visible = false; capivaras.fx.perigoX = null; }
  function atualizar(dt, t) {
    capivaras.fx.perigoX = null;
    if (st.fase === 'esperando') {
      // o relógio só anda com o busão rodando, gente no teto e o perigo ligado.
      // Se ele vencer em cima da chegada no ponto, espera o busão voltar a rodar (o obstáculo precisa de ~3,5 s para passar).
      if (!PG.ligado || !podeRodar() || !genteNoTeto().length) return;
      st.relogio -= dt;
      if (st.relogio <= 0 && viagem.restante >= PG.avisoSeg + 3) comecar(t, false);
      return;
    }
    // passando: anda junto com a rua
    st.x -= CONFIG.velocidadeRua * estado.velRua * dt;
    malha.position.x = st.x;
    if (st.x < B.comp + 1.6 && st.x > -B.comp - 1.6) capivaras.fx.perigoX = st.x;   // quem está no teto perto dele se abaixa
    // chegou na frente do busão: sorteia 1 ou 2 do teto (o escudo segura e gasta a vez)
    if (!st.escolheu && st.x <= B.comp + 0.2) {
      st.escolheu = true; st.vitimas = [];
      if (podeRodar()) {
        const l = genteNoTeto(); let n = PG.derrubaMin + Math.floor(Math.random() * (PG.derrubaMax - PG.derrubaMin + 1));
        while (n > 0 && l.length) {
          const c = l.splice((Math.random() * l.length) | 0, 1)[0]; n--;
          if (placar.usarEscudo(c, st.tipo.toLowerCase(), null)) { cont.seguraram++; continue; }
          st.vitimas.push(c);
        }
        som.galho(); busao.sacudir(0.35);
      } else cont.cancelados++;
    }
    // cada vítima cai quando o obstáculo passa por ela
    if (st.vitimas) for (let i = st.vitimas.length - 1; i >= 0; i--) {
      const c = st.vitimas[i];
      if (!(c.vaga && c.vaga.local === 'teto' && c.vaga.ocupante === c && c.estado === 'dentro')) { st.vitimas.splice(i, 1); continue; }   // já saiu do teto
      if (st.x <= c.pos.x + 0.35) {
        st.vitimas.splice(i, 1);
        if (!podeRodar()) { cont.cancelados++; continue; }   // nunca derruba com o busão parado, chegando ou de pneu furado
        capivaras.derrubar(c, 'teto', { perigo: st.tipo }); cont.derrubados++;
      }
    }
    if (st.x < -B.comp - 9 || t - st.t0 > 12) terminar();
  }
  // botão "Galho agora" (teste): tipo = 'GALHO' / 'VIADUTO' (sem tipo: sorteia)
  function agora(tipo) {
    if (st.fase !== 'esperando') return 'ja';
    if (!podeRodar()) return 'parado';
    if (!genteNoTeto().length) return 'teto';
    comecar(estado.tempo, true, tipo); return 'ok';
  }
  function alternar() { PG.ligado = !PG.ligado; const s = ler('perigos', {}); s.ligado = PG.ligado; salvar('perigos', s); if (!PG.ligado && st.fase === 'esperando') st.relogio = sortear(); return PG.ligado; }
  function descricao() {
    return `Perigos do caminho: ${PG.ligado ? 'LIGADO' : 'desligado'} · ${st.fase === 'esperando' ? 'próximo em ~' + Math.max(0, st.relogio).toFixed(0) + ' s (conta só rodando com gente no teto)' : st.tipo + ' passando'}` +
      `\nApareceram: ${cont.aparecidos} (galho ${cont.galhos} · viaduto ${cont.viadutos}) · derrubaram: ${cont.derrubados} · escudo segurou: ${cont.seguraram}`;
  }
  return { atualizar, agora, alternar, descricao, cont, st, malha, terminar };
})();

/* =====================================================================
   LIVE (Fase 5): o ADAPTADOR. Lê as mensagens do tik.tools (celular) ou do TikFinity (PC),
   transforma no formato interno e chama o barramento "eventos". Nenhuma regra do jogo muda aqui.
   - Uma camada só: cada fonte é só "como conectar"; os campos são procurados numa lista (CONFIG.live.campos).
   - Mesma pessoa = mesma capivara: id = userId (senão o @), e o @ e o userId ficam ligados entre si.
   - Combo: cada AUMENTO do repeatCount vira presente na hora; a mensagem final (que só repete o total) não conta.
   - Duplicados: mesmo msgId descartado; no mesmo combo (groupId), contagem repetida, menor ou depois do fim não conta.
   - Reconexão para sempre (1 s, 2 s, 4 s… até 15 s), sem reiniciar o jogo.
   - As mensagens entram numa fila e são entregues ao jogo com limite por quadro (nada de presente perdido).
   ===================================================================== */
const live = (() => {
  const L = CONFIG.live;
  if (params.get('tikfinityUrl')) L.tikfinity.url = params.get('tikfinityUrl');   // para testes (servidor falso)
  if (params.get('tiktoolsUrl')) L.tiktools.url = params.get('tiktoolsUrl');
  const CAMPOS = {}; for (const k in L.campos) CAMPOS[k] = L.campos[k].map((c) => c.split('.'));
  function pegar(obj, k) {
    const lista = CAMPOS[k];
    for (let j = 0; j < lista.length; j++) {
      const cam = lista[j]; let v = obj;
      for (let i = 0; i < cam.length && v != null; i++) v = typeof v === 'object' ? v[cam[i]] : undefined;
      if (v !== undefined && v !== null && v !== '') return v;
    }
    return undefined;
  }
  const FONTES = {
    tiktools: {
      nome: 'tik.tools',
      url(u, chave) {
        const T = L.tiktools; const sep = T.url.includes('?') ? '&' : '?';
        return T.url + sep + encodeURIComponent(T.paramUsuario) + '=' + encodeURIComponent(u) + (chave ? '&' + encodeURIComponent(T.paramChave) + '=' + encodeURIComponent(chave) : '');
      },
    },
    tikfinity: { nome: 'TikFinity', url() { return L.tikfinity.url; } },
    teste: { nome: 'Só teste (simulador)', url: null },
  };
  const TIPOS = { chat: 'comentario', comment: 'comentario', gift: 'presente', like: 'curtida', follow: 'follow', share: 'compartilhar', social: 'social',
    member: 'entrada', join: 'entrada', roomuser: 'espectadores', roomuserseq: 'espectadores', viewers: 'espectadores',
    roominfo: 'info', connected: 'info', streamend: 'fim', liveend: 'fim', error: 'erro' };

  const st = { fonte: 'teste', usuario: L.usuarioPadrao, chave: '', status: 'desligado', publicar: true, ligado: false,
    ws: null, tentativas: 0, timer: 0, proxTentativa: 0, ultimaEspera: 0, conectadoDesde: 0, ultimoEvento: 0, ultimaMsg: 0, espectadores: null, erro: '', inicio: Date.now() };
  const cont = { mensagens: 0, comentarios: 0, presentes: 0, presentesMsgs: 0, finaisDeCombo: 0, curtidas: 0, follows: 0, compartilhamentos: 0, entradas: 0,
    duplicados: 0, ignorados: 0, quebradas: 0, outros: 0, conexoes: 0, quedas: 0, entregues: 0, filaMaior: 0, comentariosDescartados: 0 };
  const ganchos = { curtida: null, follow: null, compartilhar: null };   // ponto para ligar depois (CONFIG.live.usarCurtida etc.)

  // ---------- ids já vistos (anel com limite) ----------
  const vistos = new Set(), anel = new Array(L.idsVistosMax); let anelPos = 0;
  function jaVisto(k) {
    if (vistos.has(k)) return true;
    const velho = anel[anelPos]; if (velho !== undefined) vistos.delete(velho);
    anel[anelPos] = k; anelPos = (anelPos + 1) % L.idsVistosMax; vistos.add(k);
    return false;
  }

  // ---------- quem é a pessoa ----------
  const idPorUser = new Map(), idPorArroba = new Map();
  function guardarId(m, k, v) { m.set(k, v); if (m.size > L.pessoasMax) m.delete(m.keys().next().value); }
  const simples = (v) => v != null && typeof v !== 'object';
  function pessoa(data) {
    const u0 = pegar(data, 'userId'), a0 = pegar(data, 'uniqueId');
    const uid = simples(u0) ? String(u0).trim() : '';
    const arroba = simples(a0) ? String(a0).replace(/^@/, '').trim() : '';
    const ch = arroba.toLowerCase();
    if (!uid && !ch) return null;
    // a mesma pessoa vira a mesma capivara mesmo se só um dos campos vier (o @ e o userId ficam ligados)
    const id = (uid && idPorUser.get(uid)) || (ch && idPorArroba.get(ch)) || uid || ('@' + ch);
    if (uid && !idPorUser.has(uid)) guardarId(idPorUser, uid, id);
    if (ch && !idPorArroba.has(ch)) guardarId(idPorArroba, ch, id);
    const nick = pegar(data, 'nickname'), foto = pegar(data, 'foto');
    const nome = (simples(nick) ? String(nick) : '').replace(/[\u0000-\u001f]/g, '').trim().slice(0, 40) || arroba || uid;
    return { id, nome, foto: typeof foto === 'string' && /^https?:\/\//i.test(foto) ? foto : null, arroba: ch };
  }
  let ignorarSet = new Set();
  function montarIgnorar() { ignorarSet = new Set([...L.ignorar, st.usuario].map((x) => String(x || '').replace(/^@/, '').trim().toLowerCase()).filter(Boolean)); }
  montarIgnorar();

  // ---------- registro cru + captura (com limite) ----------
  const cru = [], captura = [];
  function guardarCru(txt) {
    const h = new Date();
    cru.push(String(h.getHours()).padStart(2, '0') + ':' + String(h.getMinutes()).padStart(2, '0') + ':' + String(h.getSeconds()).padStart(2, '0') + '  ' + (txt.length > 400 ? txt.slice(0, 400) + '…' : txt));
    if (cru.length > L.registroMax) cru.shift();
    captura.push([Date.now(), txt.length > 6000 ? txt.slice(0, 6000) : txt]);
    if (captura.length > L.capturaMax) captura.shift();
  }

  // ---------- presentes recebidos (para confirmar os nomes reais) ----------
  const recebidos = new Map(), iconePorEfeito = new Map(), iconePorChave = new Map(), nomePorChave = new Map(), nomePorId = new Map();
  function registrarPresente(nome, gid, moedas, img, qtd) {
    const chave = chavePresente(nome), k = chave + '#' + (gid ?? '');
    let r = recebidos.get(k);
    if (!r) {
      if (recebidos.size >= L.presentesRecebidosMax) recebidos.delete(recebidos.keys().next().value);
      r = { nome, chave, id: gid, moedas: 0, img: null, mensagens: 0, unidades: 0 }; recebidos.set(k, r);
    }
    r.mensagens++; r.unidades += qtd; if (moedas) r.moedas = moedas; if (nome) r.nome = nome;
    if (chave) nomePorChave.set(chave, nome); if (gid != null) nomePorId.set(String(gid), nome);
    if (typeof img === 'string' && /^https?:\/\//i.test(img)) {
      r.img = img; iconePorChave.set(chave, img);
      const ef = efeitoDoPresente(nome, gid); if (ef) iconePorEfeito.set(ef, img);
      if (ef && typeof imagensPresentes !== 'undefined') imagensPresentes.daLive(ef, img);   // Fase 5.4: guarda no navegador para o card e a vitrine
    }
  }
  function textoPresentes() {
    if (!recebidos.size) return 'Nenhum presente chegou ainda nesta sessão.';
    const l = ['nome exato | chave | id | moedas | efeito | quantos'];
    for (const r of recebidos.values()) {
      const ef = efeitoDoPresente(r.nome, r.id);
      const porId = r.id != null && CONFIG.presentesPorId[r.id];
      l.push(`${r.nome} | ${r.chave} | ${r.id ?? '-'} | ${r.moedas || '?'} | ${ef ? ef + (porId ? ' (pelo id)' : '') : 'sem efeito, só embarca'} | ${r.unidades}`);
    }
    return l.join('\n');
  }

  // ---------- combos ----------
  const grupos = new Map(); let proxLimpeza = 0;
  function limparGrupos(agora) {
    if (agora < proxLimpeza) return; proxLimpeza = agora + 10000;
    for (const [k, g] of grupos) if (agora - g.t > 60000) grupos.delete(k);
    while (grupos.size > 3000) grupos.delete(grupos.keys().next().value);
  }
  function presente(data, user, mid) {
    const n0 = pegar(data, 'giftName'); const nome = simples(n0) ? String(n0).trim() : '';
    const g0 = pegar(data, 'giftId'); const gid = simples(g0) && String(g0).trim() !== '' && isFinite(Number(g0)) ? Number(g0) : null;
    if (!nome && gid == null) { cont.quebradas++; return; }
    const rc = Math.max(1, Math.floor(Number(pegar(data, 'repeatCount')) || 1));
    const f0 = pegar(data, 'repeatEnd'); const fim = f0 === true || f0 === 1 || f0 === 'true' || f0 === '1';
    const combo = Number(pegar(data, 'giftType')) === 1;
    const grupo = pegar(data, 'groupId');
    const moedas = Number(pegar(data, 'moedas')) || 0;
    cont.presentesMsgs++;
    let qtd;
    if (combo) {
      const agora = performance.now();
      const chaveG = user.id + '|' + (gid ?? chavePresente(nome)) + '|' + (simples(grupo) ? grupo : '');
      let g = grupos.get(chaveG);
      // sem groupId: depois do fim (ou muito tempo parado com contagem que não sobe), é um combo novo
      if (g && !simples(grupo) && (g.fim || (rc <= g.conta && agora - g.t > 8000))) g = null;
      if (!g) { g = { conta: 0, fim: false, t: agora }; grupos.set(chaveG, g); }
      if (g.fim) { cont.duplicados++; return; }                  // chegou depois do fim do combo
      g.t = agora;
      qtd = rc - g.conta;
      if (fim) g.fim = true;
      if (qtd <= 0) { if (fim) cont.finaisDeCombo++; else cont.duplicados++; return; }   // só repetiu o total / repetida / fora de ordem
      g.conta = rc;
    } else qtd = rc;                                              // presente que não faz combo: 1 × repeatCount
    cont.presentes += qtd;
    registrarPresente(nome || ('presente ' + gid), gid, moedas, pegar(data, 'giftImg'), qtd);
    enfileirar({ t: 'presente', user, nome: nome || String(gid), qtd, gid, mid, moedas });
  }

  // ---------- fila para o jogo (limite por quadro) ----------
  const fila = []; let cabeca = 0;
  function pendentes() { return fila.length - cabeca; }
  function enfileirar(j) {
    if (!st.publicar) return;                                     // modo só captura: conta e registra, mas não mexe no jogo
    fila.push(j);
    const n = fila.length - cabeca; if (n > cont.filaMaior) cont.filaMaior = n;
    if (j.t === 'comentario' && n > L.filaComentariosMax) {      // fila enorme: descarta o comentário mais velho (presente nunca)
      for (let i = cabeca; i < fila.length; i++) if (fila[i] && fila[i].t === 'comentario') { fila[i] = null; cont.comentariosDescartados++; break; }
    }
  }
  function entregar(j) {
    cont.entregues++;
    if (j.t === 'comentario') eventos.comentario(j.user, j.texto, { msgId: j.mid });
    else if (j.t === 'presente') eventos.presente(j.user, j.nome, j.qtd, { msgId: j.mid != null ? j.mid : null, giftId: j.gid, moedas: j.moedas });
    else if (ganchos[j.t]) ganchos[j.t](j.user, j.n || 1);       // curtida / follow / compartilhar (desligados por enquanto)
  }
  function bombear() {
    let n = 0;
    while (cabeca < fila.length && n < L.porQuadro) { const j = fila[cabeca]; fila[cabeca++] = undefined; if (!j) continue; n++; entregar(j); }
    if (cabeca === fila.length) { fila.length = 0; cabeca = 0; }
    else if (cabeca > 2048) { fila.splice(0, cabeca); cabeca = 0; }
    limparGrupos(performance.now());
  }

  // ---------- mensagem chegando ----------
  function receber(raw) {
    cont.mensagens++; st.ultimaMsg = performance.now();
    const txt = typeof raw === 'string' ? raw : String(raw);
    guardarCru(txt);
    let msg; try { msg = JSON.parse(txt); } catch (e) { cont.quebradas++; return; }
    if (Array.isArray(msg)) { for (const m of msg) processar(m); } else processar(msg);
  }
  function processar(msg) {
    try {
      if (!msg || typeof msg !== 'object') { cont.quebradas++; return; }
      const data = msg.data && typeof msg.data === 'object' ? msg.data : msg;
      let tipo = TIPOS[String(msg.event || msg.type || data.type || '').toLowerCase()];
      if (tipo === 'social') { const s = String(pegar(data, 'tipoSocial') || '').toLowerCase(); tipo = s.includes('share') ? 'compartilhar' : s.includes('follow') ? 'follow' : null; }
      if (!tipo) { cont.outros++; return; }
      if (tipo === 'espectadores') { const v = Number(pegar(data, 'espectadores')); if (isFinite(v)) st.espectadores = v; return; }
      if (tipo === 'info') return;
      if (tipo === 'fim') { log('LIVE: a fonte avisou que a transmissão terminou'); return; }
      if (tipo === 'erro') { st.erro = String(data.message || data.error || msg.message || 'erro da fonte').slice(0, 140); log('LIVE: ' + st.erro); return; }
      // daqui pra baixo: evento de uma pessoa
      const m0 = pegar(data, 'msgId'); const mid = simples(m0) ? String(m0) : null;
      if (mid != null && jaVisto(mid)) { cont.duplicados++; return; }
      const user = pessoa(data);
      if (!user) { cont.quebradas++; return; }
      if (user.arroba && ignorarSet.has(user.arroba)) { cont.ignorados++; return; }   // o próprio canal não vira capivara
      st.ultimoEvento = performance.now();
      switch (tipo) {
        case 'comentario': { const tx = pegar(data, 'comentario'); cont.comentarios++; enfileirar({ t: 'comentario', user, texto: simples(tx) ? String(tx) : '', mid }); break; }
        case 'presente': presente(data, user, mid); break;
        case 'curtida': { const n = Math.max(1, Math.floor(Number(pegar(data, 'curtidas')) || 1)); cont.curtidas += n; if (L.usarCurtida) enfileirar({ t: 'curtida', user, n }); break; }
        case 'follow': cont.follows++; if (L.usarFollow) enfileirar({ t: 'follow', user }); break;
        case 'compartilhar': cont.compartilhamentos++; if (L.usarCompartilhar) enfileirar({ t: 'compartilhar', user }); break;
        case 'entrada': cont.entradas++; break;   // entrar na LIVE não faz nada no jogo (seria gente demais), só conta
      }
    } catch (e) { cont.quebradas++; console.error(e); }
  }

  // ---------- conexão ----------
  const ponto = $('#statusLive');
  function mudarStatus(s) { if (st.status === s) return; st.status = s; ponto.className = s; }
  function fechar() {
    clearTimeout(st.timer); st.timer = 0;
    const ws = st.ws; st.ws = null;
    if (ws) { ws.onopen = ws.onmessage = ws.onerror = ws.onclose = null; try { ws.close(); } catch (e) {} }
  }
  function conectar() {
    fechar();
    if (st.fonte === 'teste') { st.ligado = false; mudarStatus('simulador'); if (!simulador.ligada && params.get('simulador') !== '0') simulador.alternar(); return; }   // ?simulador=0: sem a LIVE falsa (testes)
    const F = FONTES[st.fonte]; if (!F) { mudarStatus('desligado'); return; }
    st.ligado = true;
    if (simulador.ligada) simulador.alternar();   // com a LIVE ligada, a LIVE falsa fica desligada (o botão do painel continua)
    mudarStatus('conectando');
    let ws;
    try { ws = new WebSocket(F.url(st.usuario, st.chave)); } catch (e) { st.erro = 'endereço inválido: ' + e.message; agendar(); return; }
    st.ws = ws;
    ws.onopen = () => {
      if (st.ws !== ws) return;
      st.tentativas = 0; st.erro = ''; cont.conexoes++; st.conectadoDesde = performance.now(); mudarStatus('conectado');
      log('LIVE: conectado (' + F.nome + (st.fonte === 'tiktools' ? ' @' + st.usuario : '') + ')');
    };
    ws.onmessage = (ev) => {
      if (st.ws !== ws) return;
      if (typeof ev.data === 'string') receber(ev.data);
      else if (ev.data && ev.data.text) ev.data.text().then((t) => { if (st.ws === ws) receber(t); });
    };
    ws.onerror = () => { if (st.ws === ws && !st.erro) st.erro = 'erro de conexão'; };
    ws.onclose = (ev) => {
      if (st.ws !== ws) return;
      st.ws = null;
      if (st.status === 'conectado') { cont.quedas++; log('LIVE: a conexão caiu, reconectando…'); }
      st.erro = 'fechou' + (ev.code ? ' (' + ev.code + (ev.reason ? ': ' + String(ev.reason).slice(0, 80) : '') + ')' : '');
      agendar();
    };
  }
  // reconexão: 1 s, 2 s, 4 s… até 15 s, para sempre. Nada do jogo é reiniciado.
  function agendar() {
    if (!st.ligado) { mudarStatus('desligado'); return; }
    mudarStatus('conectando');
    const espera = Math.min(L.esperaMaxMs, L.esperaMinMs * Math.pow(2, Math.min(st.tentativas, 10)));
    st.tentativas++; st.ultimaEspera = espera; st.proxTentativa = performance.now() + espera;
    clearTimeout(st.timer); st.timer = setTimeout(conectar, espera);
  }
  function iniciar(o) {
    st.fonte = FONTES[o.fonte] ? o.fonte : 'teste';
    st.usuario = String(o.usuario || L.usuarioPadrao).replace(/^@/, '').trim();
    st.chave = o.chave || '';
    if (o.publicar != null) st.publicar = !!o.publicar;
    st.tentativas = 0; st.erro = ''; montarIgnorar();
    placar.trocarUsuario(st.usuario);   // Fase 5.1: o placar guardado é por @ da LIVE
    log('LIVE: fonte ' + FONTES[st.fonte].nome + (st.fonte !== 'teste' ? ' · @' + st.usuario : '') + (st.publicar ? '' : ' (só captura)'));
    conectar();
  }
  function reconectar() { st.tentativas = 0; conectar(); }
  // a página voltou a ficar visível (celular trocou de app e voltou): se caiu, reconecta na hora
  function aoVoltar() {
    if (!st.ligado) return;
    if (!st.ws || st.ws.readyState > 1) { st.tentativas = 0; conectar(); }
  }
  function desligar() { st.ligado = false; fechar(); mudarStatus(st.fonte === 'teste' ? 'simulador' : 'desligado'); }
  function alternarCaptura() { st.publicar = !st.publicar; log('LIVE: ' + (st.publicar ? 'publicando no jogo' : 'só captura (não mexe no jogo)')); return st.publicar; }

  function exportar() {
    const h = new Date(), p2 = (n) => String(n).padStart(2, '0');
    const nome = `captura-busao-${h.getFullYear()}-${p2(h.getMonth() + 1)}-${p2(h.getDate())}-${p2(h.getHours())}${p2(h.getMinutes())}.json`;
    const corpo = { jogo: 'busao-capivaras', fase: '5.1', fonte: st.fonte, usuario: st.usuario, exportado: h.toISOString(), contadores: cont,
      presentesRecebidos: [...recebidos.values()], mensagens: captura.map(([t, d]) => ({ t, d })) };
    baixarArquivo(nome, JSON.stringify(corpo, null, 1));
    return nome;
  }
  const NOME_STATUS = { conectado: 'CONECTADO', conectando: 'conectando…', simulador: 'simulador', desligado: 'desligado' };
  function descricao() {
    const agora = performance.now();
    const linhas = [];
    linhas.push(`Fonte: ${FONTES[st.fonte].nome}${st.fonte !== 'teste' ? ' · @' + st.usuario : ''} · ${NOME_STATUS[st.status]}` +
      (st.status === 'conectado' ? ' há ' + tempoTexto((agora - st.conectadoDesde) / 1000) : '') + (st.publicar ? '' : '   [SÓ CAPTURA]'));
    linhas.push(`Último evento: ${st.ultimoEvento ? tempoTexto((agora - st.ultimoEvento) / 1000) + ' atrás' : 'nenhum'}   espectadores: ${st.espectadores ?? '?'}   fila p/ o jogo: ${pendentes()} (maior ${cont.filaMaior})`);
    linhas.push(`Comentários ${cont.comentarios} · presentes ${cont.presentes} (mensagens ${cont.presentesMsgs}, finais de combo ${cont.finaisDeCombo})`);
    linhas.push(`Curtidas ${cont.curtidas} · follows ${cont.follows} · compartilhamentos ${cont.compartilhamentos} · entradas ${cont.entradas}`);
    linhas.push(`Duplicados descartados ${cont.duplicados + eventos.cont.repetidos} · próprio canal ${cont.ignorados} · quebradas ${cont.quebradas} · outras ${cont.outros}`);
    linhas.push(`Mensagens ${cont.mensagens} · conexões ${cont.conexoes} · quedas ${cont.quedas}` +
      (st.status === 'conectando' && st.ligado ? ' · próxima tentativa em ' + Math.max(0, Math.ceil((st.proxTentativa - agora) / 1000)) + ' s' : '') + (st.erro ? ' · ' + st.erro : ''));
    return linhas.join('\n');
  }
  function textoCru(n = 40) { return cru.slice(-n).reverse().join('\n'); }
  function tamanhos() { return { vistos: vistos.size, idPorUser: idPorUser.size, idPorArroba: idPorArroba.size, grupos: grupos.size, cru: cru.length, captura: captura.length, fila: pendentes(), recebidos: recebidos.size }; }

  return { iniciar, conectar, reconectar, aoVoltar, desligar, alternarCaptura, bombear, receber, processar, exportar, descricao, textoCru, textoPresentes, tamanhos,
    st, cont, ganchos, pegar, pessoa, recebidos, pendentes,
    icone: (ef, chave) => iconePorChave.get(chave) || iconePorEfeito.get(ef) || null,
    nomeRecebido: (chave) => nomePorChave.get(chave) || null, nomePorId: (id) => nomePorId.get(String(id)) || null,
    get status() { return st.status; }, get publicar() { return st.publicar; }, get fonte() { return st.fonte; } };
})();

/* =====================================================================
   RODÍZIO DE PRESENTES (Fase 5). Fase 5.4: não tem mais elemento próprio. Continua dando a lista (presente → efeito) para o painel,
   o desenho de caixinha (último recurso da imagem de cada presente) e o liga/desliga "Rodízio de presentes" (desligado: o card só mostra o COMENTE).
   ===================================================================== */
const rodizio = (() => {
  const COR = { entrar: '#e53935', escudo: '#29b6f6', motorista: '#d32f2f', cobrador: '#7b1fa2', freada: '#ff7043', buraco: '#8d6e63', lombada: '#ffb300', fiscal: '#fb8c00',
    janela: '#29b6f6', gigante: '#7cb342', pagode: '#ec407a', buzinaco: '#fdd835', pneu: '#78909c', vip: '#ffc107' };
  const ORDEM = ['entrar', 'escudo', 'motorista', 'cobrador', ...caos.TODOS];
  const cfg = { ligado: ler('rodizio', CONFIG.rodizio.ligado) };
  const desenhados = {};
  // ícone simples desenhado no próprio jogo (uma vez por efeito): rosa, ou caixinha de presente na cor do efeito
  function desenho(ef) {
    if (desenhados[ef]) return desenhados[ef];
    const c = document.createElement('canvas'); c.width = c.height = 96; const g = c.getContext('2d');
    if (ef === 'entrar') {
      g.strokeStyle = '#2e7d32'; g.lineWidth = 7; g.beginPath(); g.moveTo(48, 90); g.quadraticCurveTo(42, 66, 48, 46); g.stroke();
      g.fillStyle = '#43a047'; g.beginPath(); g.ellipse(35, 70, 13, 6, -0.6, 0, 7); g.fill();
      for (const [x, y, r, cor] of [[48, 32, 24, '#b71c1c'], [38, 28, 14, '#e53935'], [58, 28, 14, '#e53935'], [48, 22, 12, '#ef5350']]) { g.fillStyle = cor; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
      g.strokeStyle = '#7f0000'; g.lineWidth = 3; g.beginPath(); g.arc(48, 28, 8, 0.6, 5.2); g.stroke();
    } else if (ef === 'escudo') {   // escudo azul
      g.fillStyle = '#0277bd'; g.beginPath(); g.moveTo(48, 8); g.lineTo(82, 20); g.quadraticCurveTo(80, 66, 48, 90); g.quadraticCurveTo(16, 66, 14, 20); g.closePath(); g.fill();
      g.fillStyle = '#4fc3f7'; g.beginPath(); g.moveTo(48, 18); g.lineTo(72, 27); g.quadraticCurveTo(70, 61, 48, 79); g.quadraticCurveTo(26, 61, 24, 27); g.closePath(); g.fill();
      g.strokeStyle = '#fff'; g.lineWidth = 7; g.lineCap = 'round'; g.beginPath(); g.moveTo(36, 48); g.lineTo(46, 58); g.lineTo(62, 38); g.stroke();
    } else {
      const cor = COR[ef] || '#ab47bc';
      g.fillStyle = cor; g.fillRect(16, 44, 64, 44); g.fillStyle = 'rgba(0,0,0,.2)'; g.fillRect(16, 44, 64, 7);
      g.fillStyle = cor; g.fillRect(11, 32, 74, 16);
      g.fillStyle = '#fff'; g.fillRect(42, 32, 12, 56);
      g.beginPath(); g.ellipse(35, 24, 13, 9, -0.5, 0, 7); g.ellipse(61, 24, 13, 9, 0.5, 0, 7); g.fill();
      g.fillStyle = cor; g.beginPath(); g.arc(48, 28, 6, 0, 7); g.fill();
    }
    return (desenhados[ef] = c.toDataURL('image/png'));
  }
  const maiuscula = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  function lista() {
    const l = [];
    for (const ef of ORDEM) {
      let chave = null;
      for (const k in CONFIG.presentes) if (CONFIG.presentes[k] === ef) { chave = k; break; }
      let nome = chave ? (CONFIG.nomesNaTela[chave] || live.nomeRecebido(chave) || maiuscula(chave)) : null;
      if (!chave) for (const id in CONFIG.presentesPorId) if (CONFIG.presentesPorId[id] === ef && live.nomePorId(id)) { nome = live.nomePorId(id); chave = chavePresente(nome); break; }
      if (nome) l.push({ ef, chave, nome });
    }
    return l;
  }
  function alternar() { cfg.ligado = !cfg.ligado; salvar('rodizio', cfg.ligado); return cfg.ligado; }
  return { alternar, lista, cfg, desenho, get fase() { return dica.face >= 0 ? 'mostrando' : 'fora'; }, get texto() { return dica.texto; } };
})();

/* =====================================================================
   IMAGEM DE CADA PRESENTE (Fase 5.4). Ordem: 1) arquivo salvo pelo criador (CONFIG.vitrine.pastas); 2) a imagem que a LIVE mandou com o
   presente (giftPictureUrl), GUARDADA no navegador para as próximas LIVEs; 3) a caixinha desenhada pelo jogo (rodizio.desenho).
   Cada imagem é testada escondida (new Image) antes de ir para a tela: se falhar, cai para a próxima sem piscar. <img> não precisa de CORS.
   ===================================================================== */
// balãozinho de chat do item "COMENTE → FILA" (desenho nosso, mesmo do antigo card COMENTE)
const IMG_COMENTE = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">' +
  '<path fill="#fff59d" d="M4 3h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>' +
  '<circle cx="8" cy="10" r="1.6" fill="#2e7d32"/><circle cx="12" cy="10" r="1.6" fill="#2e7d32"/><circle cx="16" cy="10" r="1.6" fill="#2e7d32"/></svg>');
const imagensPresentes = (() => {
  const V = CONFIG.vitrine;
  const guardadas = ler('imgPresentes', {});    // efeito -> URL que a LIVE mandou (fica para as próximas LIVEs)
  const st = new Map();                         // item -> { cands, k, src, nivel, testando, ruins }
  const ouvintes = new Set();                   // card e vitrine: avisados quando a imagem de um item muda
  const cont = { arquivo: 0, live: 0, caixinha: 0, falhas: 0 };
  const chaveDe = (it) => it.comente ? 'comente' : it.efeito;
  function candidatos(it) {
    if (it.comente) return [{ src: IMG_COMENTE, nivel: 'nosso' }];
    const l = [];
    if (it.arquivo) for (const p of V.pastas) l.push({ src: encodeURI(p.replace('{nome}', it.arquivo)), nivel: 'arquivo' });
    const lv = live.icone(it.efeito, null) || guardadas[it.efeito];
    if (lv) l.push({ src: lv, nivel: 'live' });
    l.push({ src: rodizio.desenho(it.efeito), nivel: 'caixinha' });
    return l;
  }
  function est(it) {
    let e = st.get(it);
    if (!e) { e = { cands: candidatos(it), k: -1, src: '', nivel: '', testando: null, ruins: new Set() }; st.set(it, e); }
    return e;
  }
  function usar(it, e, c) {
    if (e.src === c.src) return;
    e.src = c.src; e.nivel = c.nivel;
    for (const f of ouvintes) f(it, c.src);
  }
  // testa os candidatos em ordem, escondido; o 1º que carregar vai para a tela. Os desenhos nossos (data:) entram direto.
  function resolver(it, desde = 0) {
    const e = est(it);
    for (let k = desde; k < e.cands.length; k++) {
      const c = e.cands[k];
      if (e.ruins.has(c.src)) continue;
      if (c.src.startsWith('data:')) { e.k = k; usar(it, e, c); cont[c.nivel] !== undefined && cont[c.nivel]++; return; }
      // enquanto testa, a <img> fica vazia; se demorar mais de 1,5 s, entra a caixinha (depois troca uma vez só, se a imagem chegar)
      const im = new Image(); e.testando = im;
      if (!e.src) setTimeout(() => { if (e.testando === im && !e.src) usar(it, e, e.cands[e.cands.length - 1]); }, 1500);
      let feito = false;
      const fim = (ok) => {
        if (feito || e.testando !== im) return; feito = true; clearTimeout(tm); e.testando = null;
        if (ok) { e.k = k; usar(it, e, c); cont[c.nivel]++; }
        else { e.ruins.add(c.src); cont.falhas++; resolver(it, k + 1); }
      };
      const tm = setTimeout(() => fim(false), V.imagemLimiteMs);
      im.onload = () => fim(im.naturalWidth > 0); im.onerror = () => fim(false);
      im.src = c.src;
      return;
    }
  }
  function src(it) { const e = est(it); if (!e.src && e.k < 0 && !e.testando) resolver(it); return e.src; }   // '' = ainda testando
  function nivel(it) { return est(it).nivel; }
  // a <img> da tela falhou com uma imagem que tinha carregado antes (ex.: link da LIVE venceu): vai para a próxima
  function falhou(it, s) { const e = est(it); if (s && s === e.src && !s.startsWith('data:')) { e.ruins.add(s); e.src = ''; cont.falhas++; resolver(it, e.k + 1); } }
  // a LIVE mandou a imagem de um presente: guarda no navegador e, se esse item ainda não tem o arquivo do criador, passa a usar
  function daLive(ef, url) {
    if (!ef || typeof url !== 'string' || !/^https?:\/\//i.test(url)) return;
    if (guardadas[ef] !== url) { guardadas[ef] = url; salvar('imgPresentes', guardadas); }
    for (const it of V.itens) {
      if (it.efeito !== ef) continue;
      const e = est(it);
      e.cands = candidatos(it);
      if (e.nivel !== 'arquivo' && !e.testando) resolver(it);
    }
  }
  function recarregar() { st.clear(); for (const it of V.itens) resolver(it); }
  function ouvir(f) { ouvintes.add(f); }
  function texto() {
    return V.itens.map((it) => (it.comente ? 'COMENTE' : it.efeito) + ': ' + ({ arquivo: 'arquivo', live: 'da LIVE', caixinha: 'caixinha', nosso: 'desenho nosso' }[nivel(it)] || 'carregando…')).join(' · ');
  }
  for (const it of V.itens) resolver(it);
  return { src, nivel, falhou, daLive, recarregar, ouvir, texto, cont, guardadas, chaveDe };
})();

/* =====================================================================
   CARD DE DICA (Fase 5.3 -> 5.4): UM presente por vez, desenho grande em cima e o efeito em letra grande embaixo ("FREADA"), sem o nome.
   Troca a cada CONFIG.vitrine.cardSeg passando pelos itens de CONFIG.vitrine.itens (o COMENTE entra na roda), com transição suave.
   Duas faces criadas uma vez (enche a escondida e troca). A letra do efeito é MEDIDA e encolhe até caber na largura do card.
   ===================================================================== */
const dica = (() => {
  const V = CONFIG.vitrine;
  const el = $('#dica');
  const faces = [0, 1].map(() => {
    const f = document.createElement('div'); f.className = 'face';
    f.innerHTML = '<img alt=""><span class="ef"></span>'; el.append(f);
    const o = { el: f, img: f.querySelector('img'), ef: f.querySelector('.ef'), item: null };
    o.img.onerror = () => { if (o.item) imagensPresentes.falhou(o.item, o.img.getAttribute('src')); };
    return o;
  });
  let ativa = -1, face = -1, prox = 0, atualTxt = '';
  const pode = (it) => it.comente ? CONFIG.aviso.ligado : rodizio.cfg.ligado;
  function porImagem(o, s) { if (!s) o.img.removeAttribute('src'); else if (o.img.getAttribute('src') !== s) o.img.src = s; }
  imagensPresentes.ouvir((it, s) => { for (const o of faces) if (o.item === it) porImagem(o, s); });
  // mede e ajusta a letra: começa no máximo e encolhe até o texto caber na largura do card (scrollWidth <= clientWidth)
  function caber(o) {
    const u = estado.palcoW / 100;
    let px = V.cardLetraMax * u;
    o.ef.style.fontSize = px.toFixed(2) + 'px';
    const w = o.ef.clientWidth;
    if (!w) return;
    for (let n = 0; n < 8 && o.ef.scrollWidth > w; n++) {
      px = Math.max(Math.min(px * w / o.ef.scrollWidth * 0.97, px - 0.3), n < 6 ? V.cardLetraMin * u : 4);
      o.ef.style.fontSize = px.toFixed(2) + 'px';
    }
  }
  function encher(o, it) {
    o.item = it;
    o.el.classList.toggle('comente', !!it.comente);
    o.el.style.setProperty('--cor', it.cor || '#fff');
    porImagem(o, imagensPresentes.src(it));
    o.ef.textContent = it.texto;
    caber(o);
  }
  function mostrar(k) {
    const it = V.itens[k]; if (!it) return false;
    const n = ativa < 0 ? 0 : 1 - ativa, o = faces[n];
    encher(o, it);
    o.el.classList.add('ver'); if (ativa >= 0 && ativa !== n) faces[ativa].el.classList.remove('ver');
    ativa = n; face = k; atualTxt = it.texto; return true;
  }
  function atualizar(t) {
    if (t < prox) return;
    prox = t + V.cardSeg;
    const L = V.itens;
    for (let n = 1; n <= L.length; n++) { const k = (face + n) % L.length; if (pode(L[k]) && mostrar(k)) return; }
    for (const o of faces) o.el.classList.remove('ver'); face = -1; ativa = -1; atualTxt = '';
  }
  // para o painel/capturas: mostra um item agora
  function forcar(k) { prox = estado.tempo + V.cardSeg; mostrar(k); }
  // a tela mudou de tamanho: mede a letra de novo
  function medir() { for (const o of faces) if (o.item) caber(o); }
  return { atualizar, forcar, medir, faces, get face() { return face; }, get texto() { return atualTxt; }, get item() { return V.itens[face] || null; } };
})();

/* =====================================================================
   VITRINE (Fase 5.4): de vez em quando (CONFIG.vitrine.cadaSeg), por CONFIG.vitrine.mostraSeg, uma fileira com os 7 itens
   (desenho + efeito embaixo) na FAIXA DO ANÚNCIO. Só entra sem anúncio na tela nem na fila; se chegar anúncio, ela sai NA HORA
   e o anúncio entra (anúncio tem prioridade). Não deu para entrar: tenta de novo em CONFIG.vitrine.tentarDeNovoSeg.
   Elementos criados uma vez; "--esc" encolhe para caber na faixa (como o anúncio).
   ===================================================================== */
const vitrine = (() => {
  const V = CONFIG.vitrine;
  const el = $('#vitrine');
  const cels = V.itens.map((it) => {
    const c = document.createElement('div'); c.className = 'it' + (it.comente ? ' comente' : '');
    c.innerHTML = '<img alt=""><span class="ef"></span>'; el.append(c);
    const o = { el: c, img: c.querySelector('img'), ef: c.querySelector('.ef'), item: it };
    o.ef.textContent = it.texto;
    o.img.onerror = () => imagensPresentes.falhou(it, o.img.getAttribute('src'));
    return o;
  });
  imagensPresentes.ouvir((it, s) => { for (const o of cels) if (o.item === it && o.img.getAttribute('src') !== s) o.img.src = s; });
  const cfg = { ligado: ler('vitrine', V.ligado) };
  let vis = false, ate = 0, prox = V.cadaSeg, pedida = false;
  const ret = { x0: 0, y0: 0, x1: 0, y1: 0 };
  const cont = { mostradas: 0, saiuPorAnuncio: 0, adiadas: 0 };
  function imagens() { for (const o of cels) { const s = imagensPresentes.src(o.item); if (s && o.img.getAttribute('src') !== s) o.img.src = s; } }
  // encolhe para caber na faixa do anúncio (mesma conta do anúncio da 5.3)
  function medir() {
    const W = estado.palcoW, H = estado.palcoH, Z = CONFIG.tela.zonas;
    const y0 = Z.tronosFim * H + W * 0.008, alt = Z.anuncioFim * H - y0 - W * 0.006, larg = W * 0.96;
    const w = el.offsetWidth, h = el.offsetHeight;
    const esc = Math.min(1, larg / Math.max(1, w), alt / Math.max(1, h));
    // troca o tamanho sem transição (se animasse, passaria um instante da borda da tela)
    const tinha = el.classList.contains('ja'); el.classList.add('ja');
    el.style.setProperty('--esc', esc.toFixed(3)); void el.offsetWidth;
    if (!tinha) el.classList.remove('ja');
    ret.x0 = W / 2 - w * esc / 2; ret.x1 = W / 2 + w * esc / 2; ret.y0 = y0; ret.y1 = y0 + h * esc;
    return esc;
  }
  const livre = () => anuncios.fase === 'livre' && !anuncios.pendentes();
  function mostrar(t) {
    imagens();
    medir();                 // mede e encolhe SEM transição (escondida); só depois entra suave
    el.classList.remove('ja'); void el.offsetWidth; el.classList.add('ver');
    vis = true; ate = t + V.mostraSeg; prox = t + V.cadaSeg; cont.mostradas++;   // a cada 40 s (de uma entrada à outra)
  }
  function esconder(naHora) {
    if (!vis) return;
    vis = false;
    if (naHora) el.classList.add('ja');   // sai na hora (sem transição): o anúncio entra no mesmo lugar
    el.classList.remove('ver');
  }
  // o anúncio vai aparecer: a vitrine sai na hora (chamado pelo próprio anúncio)
  function anuncioChegou() { if (vis) { esconder(true); cont.saiuPorAnuncio++; } }
  function atualizar(t) {
    if (vis) {
      if (!livre()) anuncioChegou();
      else if (t >= ate) esconder(false);
      return;
    }
    if (!(cfg.ligado || pedida) || t < prox) return;
    if (livre()) { pedida = false; mostrar(t); }
    else { prox = t + V.tentarDeNovoSeg; cont.adiadas++; }
  }
  // Simulador: "Mostrar vitrine agora" (respeita a prioridade do anúncio: espera ele sair)
  function agora() { pedida = true; prox = estado.tempo; }
  function alternar() { cfg.ligado = !cfg.ligado; salvar('vitrine', cfg.ligado); if (!cfg.ligado) esconder(true); else prox = estado.tempo + V.cadaSeg; return cfg.ligado; }
  return { atualizar, agora, alternar, medir, anuncioChegou, cfg, cont, cels, el, retangulo() { return vis ? ret : null; },
    get visivel() { return vis; }, get proxima() { return prox; } };
})();
/* =====================================================================
   FAIXA DOS TRONOS (Fase 5.3): no lugar das plaquinhas "MOTORISTA 11 s" / "COBRADOR 33 s" do meio do busão.
   Uma faixa fina, de largura inteira, logo abaixo do HUD:  [volante] Marileide [0:51]  ·  [moeda] Josué [perigo] +5s
   - nome cortado com "…" em CONFIG.tela.faixaNomeMax letras; com o funcionário da empresa: "Empresa" em cinza;
   - o selo da 5.2 (escudinho com a contagem no minuto imune; ícone de perigo que avermelha depois), pequeno;
   - o "+Ns" dourado do cobrador pisca ao lado do nome dele (soma as passagens até CONFIG.tela.somaCobradorSeg depois da última).
   Elementos criados uma vez; o texto só muda quando muda (no máximo 4× por segundo).
   ===================================================================== */
const faixaTronos = (() => {
  const el = $('#faixaTronos');
  const metades = {};
  for (const tn of ['motorista', 'cobrador']) {
    const m = document.createElement('div'); m.className = 'meia ' + tn;
    m.innerHTML = '<span class="ic">' + (tn === 'motorista' ? SVG_VOLANTE : SVG_MOEDA) + '</span><span class="nm"></span>' +
      '<span class="fz">' + SVG_IMUNE + SVG_PERIGO + '<span class="ct"></span></span><span class="soma"></span>';
    el.append(m);
    metades[tn] = { el: m, nm: m.querySelector('.nm'), fz: m.querySelector('.fz'), ct: m.querySelector('.ct'), soma: m.querySelector('.soma'),
      nmTxt: null, fzTxt: null, empresa: null, somaTxt: '' };
  }
  const soma = { valor: 0, ultima: -99, cont: 0 };
  let prox = 0;
  function cortar(nome) { const l = Array.from(nome); const n = CONFIG.tela.faixaNomeMax; return l.length > n ? l.slice(0, n).join('') + '…' : nome; }
  // o cobrador cobrou uma passagem (chamado na catraca)
  function cobrou(valor) {
    const t = estado.tempo;
    if (t - soma.ultima > CONFIG.tela.somaCobradorSeg) soma.valor = 0;
    soma.valor += valor; soma.ultima = t; soma.cont++; prox = 0;
  }
  function atualizar(t) {
    if (t < prox) return; prox = t + 0.25;
    for (const tn of ['motorista', 'cobrador']) {
      const M = metades[tn], T = tronos.por[tn], d = T.dono;
      const empresa = !d;
      if (empresa !== M.empresa) { M.el.classList.toggle('empresa', empresa); M.empresa = empresa; }
      const nm = d ? cortar(d.user.nome) : 'Empresa';
      if (nm !== M.nmTxt) { M.nm.textContent = nm; M.nmTxt = nm; }
      // selo da 5.2: escudinho "0:45" no minuto imune; depois o ícone de perigo, mais vermelho a cada degrau
      const f = tronos.fase(tn);
      const fz = !f.sentado ? '' : f.imune ? 'i' + Math.ceil(f.resta) : 'p' + f.degrau + (f.max ? 'm' : '');
      if (fz !== M.fzTxt) {
        M.fzTxt = fz;
        M.fz.classList.toggle('ver', !!fz); M.fz.classList.toggle('perigo', fz.charAt(0) === 'p'); M.fz.classList.toggle('max', !!fz && !f.imune && f.max);
        if (f.sentado && f.imune) { const r = Math.ceil(f.resta); M.ct.textContent = Math.floor(r / 60) + ':' + String(r % 60).padStart(2, '0'); }
        else M.ct.textContent = '';
        M.fz.style.color = f.sentado && !f.imune ? COR_PERIGO[Math.min(f.degrau, COR_PERIGO.length) - 1] : '';
      }
    }
    // "+Ns" do cobrador
    const M = metades.cobrador;
    const ver = !!tronos.cobrador() && soma.valor > 0 && t - soma.ultima <= CONFIG.tela.somaCobradorSeg;
    const tx = ver ? '+' + soma.valor + 's' : '';
    if (tx !== M.somaTxt) { M.soma.textContent = tx; M.soma.classList.toggle('ver', ver); M.somaTxt = tx; }
    if (!ver && t - soma.ultima > CONFIG.tela.somaCobradorSeg) soma.valor = 0;
  }
  function texto(tn) { const M = metades[tn]; return { nome: M.nmTxt, selo: M.fzTxt, empresa: M.empresa, soma: M.somaTxt }; }
  return { atualizar, cobrou, texto, soma, el };
})();

/* =====================================================================
   FALAS AUTOMÁTICAS (Fase 5.3): a capivara da empresa (volante ou catraca) fala de vez em quando
   ("cabe mais um?", "cadê o cobrador?"). No máximo 1 por vez e só se não tiver nenhum balão de chat de verdade na tela.
   Comentário de gente de verdade sempre tem prioridade. Liga/desliga no painel (CONFIG.tela.falasAuto).
   ===================================================================== */
const falasAuto = (() => {
  const FRASES = { motorista: ['cabe mais um?', 'cadê o cobrador?', 'segura firme aí atrás!', 'próximo ponto já já!'],
    cobrador: ['passagem, por favor!', 'me dá um lugar aí?', 'tem troco?', 'olha a catraca!'] };
  let prox = 30;
  function atualizar(t) {
    if (t < prox) return;
    const [a, b] = CONFIG.tela.falasAutoSeg; prox = t + aleat(a, b);
    if (!CONFIG.tela.falasAuto) return;
    const vagas = tronos.lista.filter((T) => !T.dono && T.vaga.ocupante && T.vaga.ocupante.empresa);
    if (!vagas.length) return;
    const T = escolher(vagas), c = T.vaga.ocupante;
    rotulos.fala(c, escolher(FRASES[T.nome]));
  }
  function alternar() { CONFIG.tela.falasAuto = !CONFIG.tela.falasAuto; salvar('falasAuto', CONFIG.tela.falasAuto); return CONFIG.tela.falasAuto; }
  return { atualizar, alternar };
})();

/* =====================================================================
   TAMANHO (9:16 com faixas pretas)
   ===================================================================== */
function redimensionar() {
  const W = Math.min(innerWidth, innerHeight * 9 / 16), H = W * 16 / 9;
  palco.style.width = W + 'px'; palco.style.height = H + 'px';
  palco.style.setProperty('--u', (W / 100) + 'px');
  palco.style.setProperty('--topo', (H * CONFIG.layout.topoLivre) + 'px');
  estado.palcoW = W; estado.palcoH = H;
  renderer.setSize(W, H, false);
  camera.aspect = 9 / 16; camera.updateProjectionMatrix();
  for (const p of rotulos.placas) p.medir = true;
  for (const b of rotulos.baloes) b.medir = true;
  for (const e of rotulos.efeitos) e.medir = true;
  // Fase 5.3: zonas fixas da tela (CONFIG.tela.zonas) viram variáveis do CSS
  const Zt = CONFIG.tela.zonas;
  palco.style.setProperty('--hudAlt', ((Zt.hudFim - CONFIG.layout.topoLivre) * H) + 'px');
  palco.style.setProperty('--zTronos', (Zt.hudFim * H + W * 0.006) + 'px');
  palco.style.setProperty('--altTronos', ((Zt.tronosFim - Zt.hudFim) * H - W * 0.006) + 'px');
  palco.style.setProperty('--zAnuncio', (Zt.tronosFim * H + W * 0.008) + 'px');
  if (typeof anuncios !== 'undefined') anuncios.medirZona();
  if (typeof dica !== 'undefined') { dica.medir(); if (vitrine.visivel) vitrine.medir(); }   // Fase 5.4: letra do card e vitrine medidas de novo
}
addEventListener('resize', redimensionar); redimensionar();

/* =====================================================================
   MODO CELULAR / PC + AJUSTE AUTOMÁTICO DE QUALIDADE
   ===================================================================== */
function aplicarModo(modo, avisar = true) {
  estado.modo = modo; salvar('modo', modo);
  const m = estado.m;
  estado.pixelRatio = m.pixelRatio; renderer.setPixelRatio(estado.pixelRatio); redimensionar();
  const sombras = m.sombras;
  if (renderer.shadowMap.enabled !== sombras) {
    renderer.shadowMap.enabled = sombras;
    cena.traverse((o) => { if (o.material) { (Array.isArray(o.material) ? o.material : [o.material]).forEach((mt) => (mt.needsUpdate = true)); } });
  }
  cenaModulo.sol.castShadow = sombras; capivaras.setSombras(sombras);
  const n = capivaras.aplicarLimites();   // os tronos ficam fora: ninguém sai do volante nem da catraca
  if (avisar) anunciar('Modo ' + m.nome + (n ? ' — ' + n + ' voltaram pro ponto' : ''));
  log('modo ' + m.nome + ': ' + m.dentro + ' dentro, ' + m.teto + ' no teto, ' + m.fps + ' quadros/s');
}
const qualidade = { baixos: 0, altos: 0, ultimoAjuste: 0 };
function ajustarQualidade(fps, t) {
  if (!estado.ajusteAuto) return;
  const alvo = estado.m.fps;
  if (fps < alvo * 0.85) { qualidade.baixos++; qualidade.altos = 0; } else if (fps >= alvo * 0.97) { qualidade.altos++; qualidade.baixos = 0; } else { qualidade.baixos = 0; }
  if (qualidade.baixos >= 5 && estado.pixelRatio > estado.m.pixelMin + 0.01) {
    estado.pixelRatio = Math.max(estado.m.pixelMin, +(estado.pixelRatio * 0.8).toFixed(2));
    renderer.setPixelRatio(estado.pixelRatio); redimensionar(); qualidade.baixos = 0;
    log('qualidade: resolução baixou para ' + Math.round(estado.pixelRatio * 100) + '%');
  } else if (qualidade.altos >= 30 && estado.pixelRatio < estado.m.pixelRatio - 0.01) {
    estado.pixelRatio = Math.min(estado.m.pixelRatio, +(estado.pixelRatio / 0.8).toFixed(2));
    renderer.setPixelRatio(estado.pixelRatio); redimensionar(); qualidade.altos = 0;
    log('qualidade: resolução subiu para ' + Math.round(estado.pixelRatio * 100) + '%');
  }
}

/* =====================================================================
   TELA ACESA (Wake Lock) + liberar som no primeiro toque
   Fase 5: ao voltar para a página (celular trocou de app), retoma o som, pede a tela acesa de novo e reconecta se caiu.
   ===================================================================== */
let travaTela = null;
async function manterTelaAcesa() {
  try { if ('wakeLock' in navigator && !travaTela && document.visibilityState === 'visible') { travaTela = await navigator.wakeLock.request('screen'); travaTela.addEventListener('release', () => (travaTela = null)); } } catch (e) {}
}
addEventListener('pointerdown', () => { som.iniciar(); manterTelaAcesa(); setTimeout(() => avisoSom.atualizar(), 300); }, { passive: true });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { som.retomar(); manterTelaAcesa(); live.aoVoltar(); setTimeout(() => avisoSom.atualizar(), 500); }
});

/* =====================================================================
   TELA DE COMEÇO (Fase 5): @ da LIVE, fonte (tik.tools / TikFinity / Só teste), chave do tik.tools e "Começar".
   ?auto=1 (ou modo PC com TikFinity) pula a tela e já conecta. Também valem ?fonte=, ?usuario=, ?modo=, ?publicar=0.
   A chave fica SÓ no navegador (localStorage); nunca no código.
   ===================================================================== */
const inicio = (() => {
  const el = $('#inicio');
  const FONTES_OK = ['tiktools', 'tikfinity', 'teste'];
  el.innerHTML = `<div class="caixa">
    <h1>Busão Lotado<br>das Capivaras</h1>
    <label>@ da LIVE<input id="iniUsuario" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <div class="rotulo">De onde vêm os eventos</div>
    <div class="fontes">
      <button data-f="tiktools">tik.tools<small>celular</small></button>
      <button data-f="tikfinity">TikFinity<small>PC</small></button>
      <button data-f="teste">Só teste<small>simulador</small></button>
    </div>
    <label id="iniChaveL">Chave do tik.tools<input id="iniChave" type="password" autocomplete="off" spellcheck="false"></label>
    <div class="dica" id="iniDica"></div>
    <button id="iniComecar">Começar</button></div>`;
  const eU = $('#iniUsuario'), eC = $('#iniChave'), eCL = $('#iniChaveL'), eD = $('#iniDica');
  const fParam = params.get('fonte');
  let fonte = FONTES_OK.includes(fParam) ? fParam : (estado.modo === 'pc' ? 'tikfinity' : 'tiktools');   // já vem escolhida pelo modo
  eU.value = (params.get('usuario') || ler('live.usuario', CONFIG.live.usuarioPadrao) || '').replace(/^@/, '');
  eC.value = ler('live.chave', '') || '';
  function dica(erro) {
    eD.classList.toggle('erro', !!erro);
    eD.textContent = erro || (fonte === 'tiktools' ? 'A chave fica salva só neste aparelho.' : fonte === 'tikfinity' ? 'Precisa do TikFinity aberto neste PC.' : 'Sem LIVE: o simulador manda eventos de mentira.');
  }
  function marcar() {
    for (const b of el.querySelectorAll('.fontes button')) b.classList.toggle('on', b.dataset.f === fonte);
    eCL.style.display = fonte === 'tiktools' ? '' : 'none'; dica();
  }
  el.addEventListener('click', (e) => { const b = e.target.closest('.fontes button'); if (b) { fonte = b.dataset.f; marcar(); } });
  el.addEventListener('pointerdown', (e) => e.stopPropagation());
  el.addEventListener('keydown', (e) => { e.stopPropagation(); if (e.key === 'Enter') comecar(); });
  $('#iniComecar').addEventListener('click', () => comecar());
  function mostrar() { estado.telaInicio = true; el.hidden = false; marcar(); avisoSom.atualizar(); }
  function comecar() {
    const usuario = (eU.value || '').trim().replace(/^@/, '') || CONFIG.live.usuarioPadrao;
    const chave = (eC.value || '').trim();
    if (fonte === 'tiktools' && !chave) { dica('Cole a chave do tik.tools (ou escolha outra fonte).'); return false; }
    salvar('live.usuario', usuario); if (chave) salvar('live.chave', chave);
    el.hidden = true; estado.telaInicio = false;
    som.iniciar(); manterTelaAcesa(); avisoSom.ligar();   // libera o som e pede a tela acesa
    live.iniciar({ fonte, usuario, chave });   // ?publicar=0 já foi aplicado em decidir()
    return true;
  }
  function decidir() {
    const auto = params.get('auto') === '1' || (estado.modo === 'pc' && fonte === 'tikfinity');
    if (params.get('publicar') === '0') live.st.publicar = false;
    if (auto && !(fonte === 'tiktools' && !eC.value.trim())) comecar(); else mostrar();
  }
  return { mostrar, comecar, decidir, get fonte() { return fonte; }, set fonte(f) { if (FONTES_OK.includes(f)) { fonte = f; marcar(); } } };
})();
