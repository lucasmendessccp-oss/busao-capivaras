   LAÇO PRINCIPAL (30 quadros/s no celular, 60 no PC)
   ===================================================================== */
aplicarModo(estado.modo, false);
tronos.iniciar();   // começo da LIVE: as duas capivaras da empresa já estão no volante e na catraca
let ultimoQuadro = performance.now(), quadros = 0, inicioSeg = performance.now(), fpsAtual = 0, msJs = 0, msJsAcc = 0;
const stats = { fps: 0, msJs: 0, msJsMax: 0, chamadas: 0, triangulos: 0, historico: [] };
let msJsMaxSeg = 0, proxHudLetreiro = 0;
function passoLogica(dt) {
  estado.tempo += dt; const t = estado.tempo;
  live.bombear();   // Fase 5: entrega as mensagens da LIVE (com limite por quadro)
  simulador.passo(t);
  tronos.atualizar(t);
  caos.atualizar(dt, t);
  viagem.atualizar(dt, t);   // Fase 5.1: a velocidade da rua sai do ciclo de pontos (e do caos: freada / pneu)
  perigos.atualizar(dt, t);  // Fase 5.2: galho / viaduto (antes das capivaras: quem está no teto se abaixa)
  const vr = CONFIG.velocidadeRua * estado.velRua;
  cenaModulo.rua.offset.x += vr * dt / 6;
  cenaModulo.calcPerto.offset.x += vr * dt / 1.4;
  cenaModulo.calcLonge.offset.x += vr * dt / 1.4;
  cenaModulo.atualizarCamadas(dt, estado.velRua);
  busao.atualizar(dt, t);
  cameraDiretora.atualizar(dt, t);
  camera.updateMatrixWorld();
  capivaras.atualizar(dt, t);
  placar.atualizar(dt, t);   // Fase 5.1: tempo a bordo, rei, marcos, Banco do Rei, salvar
  anuncios.atualizar(t);
  vitrine.atualizar(t);      // Fase 5.4: vitrine com os 7 (só sem anúncio)
  dica.atualizar(t);         // Fase 5.4: card da direita (um presente por vez: desenho + efeito)
  faixaTronos.atualizar(t);  // Fase 5.3: faixa dos tronos
  falasAuto.atualizar(t);    // Fase 5.3: fala automática da capivara da empresa (só sem balão de chat)
  rotulos.atualizar(dt, t);
  if (t >= proxHudLetreiro) { proxHudLetreiro = t + 0.25; atualizarHud(); }
}
function descreverTrono(T) {
  const d = T.dono;
  return d ? '@' + d.user.nome + ' (' + tempoTexto(estado.tempo - T.desde) + ')' : 'da empresa';
}
function quadro(agora) {
  requestAnimationFrame(quadro);
  const intervalo = 1000 / estado.m.fps;
  if (agora - ultimoQuadro < intervalo * 0.8) return; // folga contra a oscilação do navegador
  const dt = Math.min((agora - ultimoQuadro) / 1000, 0.1); ultimoQuadro = agora;   // voltou do segundo plano: no máximo 0,1 s de uma vez (nada "pula")
  const j0 = performance.now();
  if (!estado.pausado) passoLogica(dt);
  const gasto = performance.now() - j0; msJsAcc += gasto; if (gasto > msJsMaxSeg) msJsMaxSeg = gasto;
  renderer.render(cena, camera);
  quadros++;
  if (agora - inicioSeg >= 1000) {
    fpsAtual = quadros * 1000 / (agora - inicioSeg); msJs = msJsAcc / quadros; quadros = 0; msJsAcc = 0; inicioSeg = agora;
    stats.fps = fpsAtual; stats.msJs = msJs; stats.msJsMax = msJsMaxSeg; msJsMaxSeg = 0;
    stats.chamadas = renderer.info.render.calls; stats.triangulos = renderer.info.render.triangles;
    stats.historico.push(+fpsAtual.toFixed(1)); if (stats.historico.length > 120) stats.historico.shift();
    ajustarQualidade(fpsAtual, estado.tempo);
    const c = capivaras.contagem(); const at = cameraDiretora.atual; const r = rotulos.contagem(); const f = fotos.contagem();
    const [tM, tC] = tronos.lista;
    painel.atualizarMedidor(
      `Quadros/s: ${fpsAtual.toFixed(1)} (alvo ${estado.m.fps})   lógica: ${msJs.toFixed(2)} ms (pico ${stats.msJsMax.toFixed(1)})\n` +
      `Modo: ${estado.m.nome}   resolução interna: ${Math.round(estado.pixelRatio * 100)}%  (${renderer.domElement.width}×${renderer.domElement.height})\n` +
      `Desenhos por quadro: ${stats.chamadas}   triângulos: ${stats.triangulos}\n` +
      `Dentro: ${c.dentro}/${estado.m.dentro}   teto: ${c.teto}/${estado.m.teto}   subindo: ${c.entrando}${c.fora ? '   empurrando: ' + c.fora : ''}\n` +
      `Fila do ponto: ${c.fila + c.esperando} (prioridade ${c.fila})   desenhadas: ${c.desenhadas}   subiram na hora: ${c.subiuNaHora} · no ponto: ${c.embarcouNoPonto}\n` +
      `Motorista: ${descreverTrono(tM)}\n` +
      `Cobrador:  ${descreverTrono(tC)}\n` +
      `Trocas de trono: ${tronos.trocas}   esperando trono: ${tM.fila.length} + ${tC.fila.length}   anúncios na fila: ${anuncios.pendentes()}\n` +
      `Caos agora: ${caos.descricaoAgora(estado.tempo)}${capivaras.pausas.size ? '   (embarque esperando)' : ''}\n` +
      `Fila de caos: ${caos.descricaoFila()}\n` +
      `Caos desde o início: ${caos.descricaoContagem()}   (juntados: ${caos.cont.juntados})\n` +
      `Balões: ${r.baloes}/${CONFIG.baloes.max} (esperando ${r.fila})   plaquinhas: ${r.grandes}   CAIU/SEGURA: ${r.efeitos}   sem espaço: ${rotulos.cont.semEspaco} · fila descartou: ${rotulos.cont.filaDescartados}\n` +
      `Anúncios: ${anuncios.cont.grandes} grandes · ${anuncios.cont.compactos} compactos · juntados ${anuncios.cont.juntados} · descartados ${anuncios.cont.descartados}\n` +
      `Vitrine: ${vitrine.cfg.ligado ? 'ligada' : 'desligada'} · mostrada ${vitrine.cont.mostradas}× · saiu por anúncio ${vitrine.cont.saiuPorAnuncio} · adiada ${vitrine.cont.adiadas}   card: ${dica.texto || '-'}\n` +
      `Fotos: ${f.ok} carregadas · ${f.erro} bloqueadas · ${f.carregando} carregando  (direto ${fotos.cont.direto} · proxy ${fotos.cont.proxy})\n` +
      `Som: volume ${Math.round(som.volume * 100)}% · ${estado.som ? 'ligado' : 'desligado'} · áudio ${som.estadoAudio} · tocando ${som.tocandoAgora}/${CONFIG.som.maxJuntos} · cortados ${som.cont.cortados}\n` +
      `Cochilo: ${CONFIG.placar.cochiloMin} min · fila do ponto: ${CONFIG.placar.pontoMin} min${estado.acelerado ? ' (ACELERADO: em segundos)' : ''} · saíram da fila por tempo: ${c.saidasTempoPonto}\n` +
      `Câmera: ${at ? at.tipo + (at.trono ? ' ' + at.trono : '') : 'plano geral'}${cameraDiretora.fila.length ? ' (+' + cameraDiretora.fila.length + ' na fila)' : ''}`);
  }
}
requestAnimationFrame(quadro);

// para testes automáticos
window.__busao = { eventos, capivaras, rotulos, fotos, cameraDiretora, simulador, estado, stats, aplicarModo, renderer, CONFIG, filtrarComentario, passoLogica, painel, camera, cena,
  tronos, anuncios, busao, caos, chavePresente, efeitoDoPresente, live, rodizio, som, inicio, avisoSom, registro,
  viagem, placar, PONTO_DESL, cenaModulo,
  cobranca, perigos,   // Fase 5.2
  faixaTronos, dica, falasAuto,   // Fase 5.3
  vitrine, imagensPresentes };     // Fase 5.4
log('jogo iniciado — modo ' + estado.m.nome);
inicio.decidir();   // Fase 5: tela de começo (ou conecta direto no PC/OBS)
</script>
</body>
</html>
